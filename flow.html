:root {
  --red: #C8102E; --red-s: #A50D26; --red-w: #FDECEE; --red-l: #F5C2CA;
  --ink: #191F28; --ink2: #333D4B; --sub: #4E5968; --muted: #6B7684; --faint: #8B95A1; --dis: #B0B8C1;
  --line-s: #D1D6DB; --line: #E5E8EB; --soft: #F2F4F6; --s1: #F9FAFB;
  --ease: cubic-bezier(.22,.61,.36,1); --spring: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--soft); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.app { height: 100vh; display: grid; grid-template-rows: 60px 1fr 68px; }

/* 머리 띠 */
.top { display: flex; align-items: center; gap: 20px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .m { width: 30px; height: 30px; border-radius: 9px; background: var(--red); color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.brand small { font-size: 13px; font-weight: 600; color: var(--muted); }
.chs { flex: 1; display: flex; justify-content: center; align-items: center; gap: 4px; min-width: 0; }
.chs button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease); }
.chs button i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--soft); color: var(--faint); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.chs button.done i { background: var(--red-w); color: var(--red-s); }
.chs button.on { background: var(--red-w); color: var(--red-s); font-weight: 700; }
.chs button.on i { background: var(--red); color: #fff; }
.chs button:hover:not(.on) { background: var(--s1); }
.tbtns { display: flex; gap: 6px; flex: none; }

const B = [0]; CH.forEach((c, k) => { B[k + 1] = B[k] + SCENES.filter(s => s.c === k).length; });

const frames = {};          // 파일 → { box, frame, set(마지막에 넣은 주소), kind }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 머리 띠 단계 칩 */

/* 바닥 진척 막대 */
$('prog').innerHTML = CH.map((c, k) => `<div class="seg" data-k="${k}" style="flex:${B[k + 1] - B[k]}"><div class="tr"></div><span>${c}</span></div>`).join('');

/* 틀(iframe) : 파일마다 하나만 만들어 장면 사이에 상태를 이어 감 */
function frameFor(sc) {
  const key = sc.src;
  if (frames[key]) return frames[key];
  const box = document.createElement('div');
  box.className = 'dev off' + (sc.kind === 'phone' ? ' phone' : '');
  box.innerHTML = (sc.kind === 'phone' ? '' : `<div class="bar"><i></i><i></i><i></i><span>${esc(sc.src.split('/').pop().split('?')[0])}</span></div>`) +
    `<div class="vp"><iframe title="${esc(sc.tool)}" allow="fullscreen; clipboard-write"></iframe><div class="load"><i></i><i></i><i></i></div></div>`;
  stage.appendChild(box);
  const frame = box.querySelector('iframe');
  frame.addEventListener('load', () => box.querySelector('.load').classList.add('done'), { once: true });
  return (frames[key] = { box, frame, set: null, kind: sc.kind });
}
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight, P = 28;
  Object.values(frames).forEach(f => {
    const vw = f.kind === 'phone' ? 390 : f.kind === 'pdf' ? 0 : 1440, vh = f.kind === 'phone' ? 844 : 900;
    const vp = f.box.querySelector('.vp');
    if (f.kind === 'pdf') {           // PDF 는 줄이지 않고 무대에 꽉 채움
      const w = W - P * 2, h = H - P * 2 - 36;
      Object.assign(f.box.style, { left: P + 'px', top: P + 'px', width: w + 'px' });
      Object.assign(vp.style, { width: w + 'px', height: h + 'px' });
      Object.assign(f.frame.style, { width: w + 'px', height: h + 'px', transform: 'none' });
      return;
    }
    const chrome = f.kind === 'phone' ? 20 : 36, pad = f.kind === 'phone' ? 20 : 0;
    const s = Math.min((W - P * 2 - pad) / vw, (H - P * 2 - chrome) / vh);
    const w = Math.round(vw * s), h = Math.round(vh * s);
    Object.assign(vp.style, { width: w + 'px', height: h + 'px' });
    Object.assign(f.frame.style, { width: vw + 'px', height: vh + 'px', transform: `scale(${s})` });
    const bw = w + pad, bh = h + chrome;
    Object.assign(f.box.style, { left: Math.round((W - bw) / 2) + 'px', top: Math.round((H - bh) / 2) + 'px', width: bw + 'px' });
  });
}
window.addEventListener('resize', layout);

function showFrame(sc) {
  const f = frameFor(sc);
  const want = sc.src + (sc.hash || '');
  if (f.set === null) { f.frame.src = encodeURI(want); f.set = want; }
  else if (sc.hash && f.set !== want) { f.frame.src = encodeURI(want); f.set = want; }   // 해시만 바뀌면 다시 불러오지 않고 그 화면으로
  Object.values(frames).forEach(x => x.box.classList.toggle('off', x !== f));
  layout();
}
function hideFrames() { Object.values(frames).forEach(x => x.box.classList.add('off')); }

function renderOther(sc) {
  if (other) { other.remove(); other = null; }
  if (sc.kind === 'web' || sc.kind === 'phone') return;
  if (sc.kind === 'pdf') { showFrame(sc); return; }
  hideFrames();
  other = document.createElement('div');
  if (sc.kind === 'pages' || sc.kind === 'sheet') {
    other.className = 'gal';
    other.style.gridTemplateColumns = `repeat(${sc.kind === 'sheet' ? 2 : sc.cols || 3}, minmax(0, 1fr))`;
    other.innerHTML = sc.imgs.map(([f, cap], i) => `<figure data-src="flow/${f}.jpg"><img src="flow/${f}.jpg" alt="${esc(cap)}" loading="lazy"><figcaption><em>${sc.kind === 'pages' ? i + 1 : ''}</em>${esc(cap)}</figcaption></figure>`).join('');
  } else if (sc.kind === 'end') {
    other.className = 'end';
    other.innerHTML = wheelSvg(420) + `<div class="eg"><h2>다음 바퀴는<br>소개에서 시작함</h2><p>김하늘 님 한 사람의 한 바퀴를 따라 도구 13가지를 이어 봤음</p><ol>${
      CH.slice(1, 7).map((c, k) => `<li><b>${k + 1} ${c}</b><span>${[...new Set(SCENES.filter(s => s.c === k + 1).map(s => s.tool.replace(/\(.*?\)/g, '').trim()))].join(' · ')}</span></li>`).join('')}</ol>
      <div class="acts" style="margin-top:22px"><button type="button" class="pri" data-go="0">처음부터 다시</button></div></div>`;
  }
  stage.appendChild(other);
}
function wheelSvg(S) {
  const c = S / 2, r = S * 0.36, nr = S * 0.085, a = i => (-90 + i * 60) * Math.PI / 180;
  let g = `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#FDECEE" stroke-width="${S * 0.06}"/>`;
  for (let i = 0; i < 6; i++) {
    const x = c + r * Math.cos(a(i)), y = c + r * Math.sin(a(i));
    g += `<circle cx="${x}" cy="${y}" r="${nr}" fill="#C8102E"/><text x="${x}" y="${y - 2}" text-anchor="middle" font-size="${nr * 0.42}" font-weight="700" fill="#fff">${i + 1}</text><text x="${x}" y="${y + nr * 0.42}" text-anchor="middle" font-size="${nr * 0.3}" font-weight="700" fill="#fff">${CH[i + 1]}</text>`;
  }
  return g + `<circle cx="${c}" cy="${c}" r="${S * 0.15}" fill="#191F28"/><text x="${c}" y="${c - 4}" text-anchor="middle" font-size="${S * 0.045}" font-weight="700" fill="#fff">약관 하나</text><text x="${c}" y="${c + S * 0.045}" text-anchor="middle" font-size="${S * 0.03}" fill="#B0B8C1">특약 마스터</text></svg>`;
}

  const chip = k === 0 ? '<span class="chip grey">시작</span>' : k === 7 ? '<span class="chip grey">정리</span>' : `<span class="chip">${k} ${CH[k]} · ${nIn} / ${tot}</span>`;

  const open = sc.src ? `<a class="sec" href="${encodeURI(sc.src + (sc.hash || ''))}" target="_blank" rel="noopener">새 창으로 열기</a>` : '';
  const dl = (sc.download ? `<a class="sec" href="${encodeURI(sc.download)}" download>엑셀 받기</a>` : '') + (sc.pdf ? `<a class="sec" href="${encodeURI(sc.pdf)}" target="_blank" rel="noopener">PDF 열기</a>` : '');
  side.innerHTML = `${chip}
    <h1>${esc(sc.t)}</h1>
    <div class="story"><img src="ui/mascots/${DOLL[k]}.webp" alt=""><p>${sc.story}</p></div>
    <div class="lbl">이렇게 보여 줌</div>
    <ol class="how">${sc.how.map(h => `<li>${esc(h)}</li>`).join('')}</ol>
    ${acts || open || dl ? `<div class="acts">${acts}${open}${dl}</div>` : ''}
    <div class="tool">${sc.tag ? `<span class="tag">${esc(sc.tag)}</span>` : ''}<span>${esc(sc.tool)}</span>${sc.src || sc.pdf ? `<code>${esc((sc.src || sc.pdf).split('?')[0])}</code>` : ''}</div>
    <div class="note"><b>말할 거리</b>${esc(sc.note || '')}</div>
    ${cur === 0 ? '<p class="hint">화면 안을 누른 뒤에는 키보드가 그 도구로 가므로, 장면을 넘길 때는 아래 「다음」 단추를 씀</p>' : ''}`;
}
side.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const sc = SCENES[cur], a = sc.act[+b.dataset.act], f = frames[sc.src];
  if (!f) return;
  if (a.hash) { f.frame.src = encodeURI(sc.src + a.hash); f.set = sc.src + a.hash; }
  if (a.msg) f.frame.contentWindow.postMessage(a.msg, '*');
  if (a.sim) {                                                     // 보상시뮬레이터 탭으로 옮긴 뒤 안쪽 틀에 질병을 넣음
    if (f.set !== sc.src + '#sim') { f.frame.src = encodeURI(sc.src + '#sim'); f.set = sc.src + '#sim'; }
    setTimeout(() => { const w = f.frame.contentWindow; for (let i = 0; i < w.frames.length; i++) w.frames[i].postMessage({ type: 'meai-sim-query', q: a.sim }, '*'); }, 350);
  }
});

function renderBars() {
  const k = SCENES[cur].c;
  [...$('chs').children].forEach((b, i) => { b.classList.toggle('on', i === k); b.classList.toggle('done', i < k); b.setAttribute('aria-current', i === k ? 'step' : 'false'); });
  [...$('prog').children].forEach((s, i) => {
    s.classList.toggle('done', i < k); s.classList.toggle('cur', i === k);
    const tr = s.querySelector('.tr');
    if (i === k) { const f = (cur - B[k] + 1) / (B[k + 1] - B[k]) * 100; tr.innerHTML = `<i style="width:${f}%"></i><b style="left:${f}%"></b>`; }
    else tr.innerHTML = '';
  });
  $('pn').innerHTML = `${String(cur + 1).padStart(2, '0')}<small> / ${SCENES.length}</small>`;
  $('prev').disabled = cur === 0; $('next').disabled = cur === SCENES.length - 1;
}

function go(n) {
  cur = Math.max(0, Math.min(SCENES.length - 1, n));
  const sc = SCENES[cur];
  if (sc.kind === 'web' || sc.kind === 'phone') { if (other) { other.remove(); other = null; } showFrame(sc); }
  else renderOther(sc);
  renderSide(sc); renderBars(); renderList();
  history.replaceState(null, '', '#s=' + (cur + 1));
  preload();
}
/* 다음 장면의 도구를 미리 불러 둠(지금 장면이 다 뜬 뒤) */
function preload() {
  const nx = SCENES[cur + 1];
  if (!nx || !nx.src || frames[nx.src] || nx.kind === 'pdf') return;
  const now = frames[SCENES[cur].src];
  const run = () => { if (!frames[nx.src]) { const f = frameFor(nx); f.frame.src = encodeURI(nx.src + (nx.hash || '')); f.set = nx.src + (nx.hash || ''); layout(); } };
  if (now && !now.box.querySelector('.load.done')) now.frame.addEventListener('load', () => setTimeout(run, 600), { once: true });
  else setTimeout(run, 600);
}

/* 장면 목록 */
function renderList() {
  let h = '<h3>장면 목록</h3>';
  CH.forEach((c, k) => {
    h += `<div class="grp">${k === 0 || k === 7 ? c : k + ' ' + c}</div>`;
    SCENES.forEach((s, i) => { if (s.c === k) h += `<button type="button" class="it ${i === cur ? 'on' : ''}" data-i="${i}"><em>${String(i + 1).padStart(2, '0')}</em><span>${esc(s.t)}</span></button>`; });
  });
  $('sheet').innerHTML = h;
}
$('bList').onclick = () => $('drawer').classList.add('on');
$('drawer').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); $('drawer').classList.remove('on'); });
$('bNote').onclick = () => { const on = document.body.classList.toggle('nonote'); $('bNote').setAttribute('aria-pressed', String(!on)); };
$('bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
stage.addEventListener('click', e => {
  const fg = e.target.closest('figure[data-src]'); if (fg) { $('lb').querySelector('img').src = fg.dataset.src; $('lb').classList.add('on'); }
  const g = e.target.closest('[data-go]'); if (g) go(+g.dataset.go);
});
$('lb').onclick = () => $('lb').classList.remove('on');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('lb').classList.remove('on'); $('drawer').classList.remove('on'); return; }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === 'n' || e.key === 'N') $('bNote').click();
});

const m = /#s=(\d+)/.exec(location.hash);
go(m ? +m[1] - 1 : 0);
</script>
</body>
</html>
