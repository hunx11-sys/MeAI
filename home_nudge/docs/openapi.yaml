        seg: { type: integer }
        segId: { type: string }
        customers: { type: array, items: { type: string } }
        fallback: { type: boolean }
        bonus: { type: object, nullable: true }
        pullId: { type: string }
        tier: { type: string, enum: [jackpot, pair, mix] }
        reels: { type: array, items: { type: string } }
        prize: { type: object }
        ref: { type: string }
        customerId: { type: string }
        xp: { type: integer }
        mult: { type: number }
        id: { type: string }
        result: { type: object }
        runId: { type: string }
        sec: { type: integer }
        items: { type: array, items: { type: object, required: [id, cat, q], properties: { id: { type: string }, cat: { type: string }, q: { type: string } } } }
        idx: { type: integer }
        correct: { type: boolean }
        a: { type: string, enum: [O, X] }
        why: { type: string }
        src: { type: string }
        pts: { type: integer }
        score: { type: integer }
        combo: { type: integer }
        last: { type: boolean }
        summary: { type: object, properties: { score: { type: integer }, ok: { type: integer }, n: { type: integer }, best: { type: integer }, newBest: { type: boolean }, xp: { type: integer }, ticket: { type: integer }, perfect: { type: boolean } } }
        card: { type: integer, minimum: 0, maximum: 21 }
        pick: { type: integer }
        three: { type: array, items: { type: integer } }
    FunCustomer:
      type: object
      description: 룰렛 · 슬롯이 고른 내 고객 (이름은 가려서)
      properties: { id: { type: string }, name: { type: string }, age: { type: integer }, sym: { type: string }, note: { type: string }, done: { type: boolean } }
    Fun:
      type: object
      description: 행운 존 요약 (막대 칸 · 허브 카드 · 게임 화면)
      properties:
        plays: { type: object, additionalProperties: { type: object, properties: { total: { type: integer }, used: { type: integer }, left: { type: integer } } } }
        fever: { type: object, properties: { on: { type: boolean }, mult: { type: number }, until: { type: integer }, label: { type: string }, kind: { type: string }, next: { type: object, nullable: true } } }
        capLeft: { type: integer }
        cap: { type: integer }
        roulette:
          type: object
          properties:
            segments: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, color: { type: string }, pct: { type: number }, bonus: { type: boolean }, xp: { type: integer } } } }
            spins: { type: array, items: { type: object, properties: { id: { type: string }, seg: { type: integer }, segId: { type: string }, label: { type: string }, tpl: { type: string }, xp: { type: integer }, bonus: { type: boolean }, fallback: { type: boolean }, customers: { type: array, items: { $ref: '#/components/schemas/FunCustomer' } } } } }
        cslot:
