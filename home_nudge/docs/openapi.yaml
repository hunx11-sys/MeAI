        gap: { type: integer }
        hint: { type: object, nullable: true, properties: { kind: { type: string }, label: { type: string }, xp: { type: integer } } }
        goldCut: { type: integer }
        list: { type: array, items: { type: object, properties: { id: { type: string }, rank: { type: integer }, name: { type: string }, xp: { type: integer }, me: { type: boolean }, frame: { type: string }, trend: { type: integer }, cheered: { type: boolean } } } }
        xp: { type: integer }
        pass: { type: array, items: { type: object, properties: { xp: { type: integer }, label: { type: string }, reached: { type: boolean } } } }
        nextPass: { type: object, nullable: true }
        frame: { type: string }
        cheersLeft: { type: integer }
        cheersReceived: { type: array, items: { type: object, properties: { from: { type: string }, at: { type: string } } } }
    ScopeRank:
