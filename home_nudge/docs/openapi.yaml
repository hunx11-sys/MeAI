openapi: 3.0.3
info:
  title: MeAI 홈 넛지 API
  version: 5.1.0
  description: |
    MeAI 홈 「오늘의 MeAI」 넛지(출석 · 퀴즈 · 화법 · 퀘스트 · 로또 · 리그 · 대시보드 · 행운 존)용 API.
    화면 구현 `src/api/client.js`, 같은 모양의 모의 서버 `src/api/mock.js`, 보상 규칙 기준 `src/core/rules.js`.

    약속
    - 사용자 · 조직은 로그인 세션(사내 SSO 쿠키)으로 안다. 요청에 사용자 id 를 넣지 않는다.
    - 쓰기 요청은 `idem`(멱등 키, UUID)을 본문에 넣는다. 같은 (사용자, idem) 이면 처음 응답을 그대로 돌려준다(24시간).
    - 쓰기 응답 ActionResult 의 `home` 은 새 홈 요약이다. 화면은 이것만 보고 다시 그린다.
    - `ok=false` 는 오류가 아니라 「보상 없음」(reason 참고). HTTP 4xx/5xx 만 오류다.
    - 날짜는 한국 시간 'YYYY-MM-DD', 시각은 epoch ms. 동료 이름은 서버에서 가려서 보낸다(나만 실명).
    - 보상 · 한도 숫자는 운영 설정(nz_config)에서 온다. 이 명세의 예시 숫자는 예시다.
    - 행운 존(v5.1) 게임 결과(룰렛 칸 · 슬롯 릴 · 문제 · 타로 카드 · 스크래치 경품)는 서버가 정해 `data` 로 돌려준다. 화면은 응답을 받은 뒤 그 자리에 멈추는 연출만 한다.
servers:
  - url: /api/nudge/v1
security:
  - sso: []
tags:
  - { name: home, description: 홈 요약 · 행동 }
  - { name: quiz, description: 오늘의 퀴즈 }
  - { name: talk, description: 오늘의 화법 · 화법 마트 }
  - { name: lotto, description: 로또(행운번호) · 리캡 }
  - { name: league, description: 리그 · 응원 }
  - { name: fun, description: 행운 존 (CRM 룰렛 · 추천 고객 슬롯 · 고객 챙기기 · 스크래치 · OX 챌린지 · 오늘의 타로) }
  - { name: dash, description: 대시보드 (권한) }
  - { name: internal, description: 서버 간 이벤트 (내부망 · 서버 인증) }
  - { name: admin, description: 운영 화면 }

paths:
  /home:
    get:
      tags: [home]
      summary: 홈 요약 (막대 · 캡슐 · 카드 · 버디 · 배지에 필요한 전부)
      responses:
        '200': { description: 홈 요약, content: { application/json: { schema: { $ref: '#/components/schemas/Home' } } } }
  /attend:
    post:
      tags: [home]
      summary: 출석 도장 (영업일 하루 1번)
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /events:
    post:
      tags: [home]
      summary: 홈 쪽 영업 행동 알림 (화면 report)
      description: |
        `reco.open` 같은 고객은 하루 1번만 센다. `chat.custom` 은 로또 발급 기준(운영 권장, 오늘 추천 목록 고객 · 하루 5세트 · 고객당 1번).
        확정은 서버 간 이벤트(`/internal/events`)로 하고, 같은 idem 이면 한 번만 센다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idem, kind]
              properties:
                idem: { type: string, format: uuid }
                kind: { type: string, enum: [reco.open, chat.custom, chat.general, notice.read, consent.request, fortune.send, fortune.open, dash.open] }
                customerId: { type: string, description: 추천 서비스의 고객 id }
                ref: { type: string, description: 공지 id 등 }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /quiz/{quizId}/answer:
    post:
      tags: [quiz]
      summary: 오늘의 퀴즈 답 (하루 1문제 · 정답이면 응모권 1장)
      parameters: [ { $ref: '#/components/parameters/quizId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, choice], properties: { idem: { type: string }, choice: { type: string, description: "'O' · 'X' · 보기 번호(0부터)" } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /quiz/{quizId}/explained:
    post:
      tags: [quiz]
      summary: 해설 다 읽음 (오답이어도 퀘스트 인정)
      parameters: [ { $ref: '#/components/parameters/quizId' } ]
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /talks:
    get:
      tags: [talk]
      summary: 화법 목록 (40건씩)
      parameters:
        - { name: cat, in: query, schema: { type: string, pattern: '^[A-N]$' } }
        - { name: q, in: query, schema: { type: string }, description: 내용 · 이름 · 본부 · 담보 }
        - { name: sit, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [rec, likes, used, short] } }
        - { name: only, in: query, schema: { type: string, enum: [rec, best, copied, saved, mine, block, short] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, maximum: 100, default: 40 } }
      responses:
        '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/TalkPage' } } } }
    post:
      tags: [talk]
      summary: 내 화법 제출 (검수 대기)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [idem, cat, sit, head], properties: { idem: { type: string }, cat: { type: string }, sit: { type: string }, head: { type: string, maxLength: 80 }, body: { type: string, maxLength: 450 } } }
      responses:
        '200': { description: 접수, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: string }, status: { type: string, enum: [pending] }, message: { type: string } } } } } }
  /talks/{talkId}:
    get:
      tags: [talk]
      summary: 화법 한 건
      parameters: [ { $ref: '#/components/parameters/talkId' } ]
      responses: { '200': { description: 화법, content: { application/json: { schema: { $ref: '#/components/schemas/Talk' } } } } }
  /talks/{talkId}/copy:
    post:
      tags: [talk]
      summary: 따라 쓰기 완성 (서버가 copyScore 로 다시 채점 · 응모권 하루 1번)
      parameters: [ { $ref: '#/components/parameters/talkId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, typed], properties: { idem: { type: string }, typed: { type: string, maxLength: 600 } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /talks/{talkId}/reactions/{type}:
    put:
      tags: [talk]
      summary: 공감 · 저장 · 고객에게 써봤어요
      parameters:
        - { $ref: '#/components/parameters/talkId' }
        - { name: type, in: path, required: true, schema: { type: string, enum: [like, save, used] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: ['on'], properties: { 'on': { type: boolean } } } } }
      responses:
        '200': { description: 바뀐 화법 · 홈, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, talk: { $ref: '#/components/schemas/Talk' }, home: { $ref: '#/components/schemas/Home' } } } } } }
  /lotto/{round}/seen:
    post:
      tags: [lotto]
      summary: 이번 주 발표를 봤음
      parameters: [ { name: round, in: path, required: true, schema: { type: string, example: 2026-W44 } } ]
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/HomeOnly' } }
  /recap:
    get:
      tags: [lotto]
      summary: 주간 리캡 (금 17시 뒤 · 주말)
      parameters: [ { name: week, in: query, schema: { type: string, example: 2026-W44 } } ]
      responses: { '200': { description: 리캡, content: { application/json: { schema: { $ref: '#/components/schemas/Recap' } } } } }
  /recap/{week}/seen:
    post:
      tags: [lotto]
      summary: 리캡을 봤음
      parameters: [ { name: week, in: path, required: true, schema: { type: string } } ]
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/HomeOnly' } }
  /league:
    get:
      tags: [league]
      summary: 리그 (branch = 지점 리그 · 패스 · 함께 미션 / hq = 본부 안 지점 순위 / company = 전사 본부 순위)
      parameters: [ { name: scope, in: query, schema: { type: string, enum: [branch, hq, company], default: branch } } ]
      responses:
        '200': { description: 리그, content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/League' }, { $ref: '#/components/schemas/ScopeRank' } ] } } } }
  /cheers:
    post:
      tags: [league]
      summary: 동료 응원 (하루 3번 · 한 사람에 하루 1번 · 같은 지점)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, to], properties: { idem: { type: string }, to: { type: string, description: 리그 목록의 동료 id(가린 id) } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /me/record:
    get:
      tags: [dash]
      summary: 나의 MeAI 기록 (본인만)
      responses: { '200': { description: 기록, content: { application/json: { schema: { $ref: '#/components/schemas/Record' } } } } }
  /dash/org:
    get:
      tags: [dash]
      summary: 본부 현황 (TEAM_LEAD · BRANCH_MGR · HQ_MGR, 자기 조직만 · 질문 원문 비열람)
      parameters: [ { name: scope, in: query, schema: { type: string, enum: [hq, branch, team] } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses:
        '200': { description: 본부 현황, content: { application/json: { schema: { $ref: '#/components/schemas/OrgDash' } } } }
        '403': { description: 권한 없음 }
  /dash/hq:
    get:
      tags: [dash]
      summary: 본사 현황 (HQ_DATA)
      responses:
        '200': { description: 본사 현황, content: { application/json: { schema: { $ref: '#/components/schemas/HqDash' } } } }
        '403': { description: 권한 없음 }
  /settings:
    patch:
      tags: [home]
      summary: 넛지 설정 (나에게만)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } }
      responses: { '200': { $ref: '#/components/responses/HomeOnly' } }
  /buddy/{id}/dismiss:
    post:
      tags: [home]
      summary: 버디 말풍선 닫기 (그날은 다시 안 띄움)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/HomeOnly' } }
  /fun/roulette/spin:
    post:
      tags: [fun]
      summary: CRM 룰렛 돌리기 (하루 1번 + 일일 미션 보너스 1번)
      description: |
        칸(고객 활동)을 설정 가중치로 고르고, 그 활동 태그가 붙은 내 고객을 최대 3명 붙인다(없으면 연락이 뜸한 고객 · fallback=true).
        보너스 칸(응모권 +1 · 나만의 피버 30분)은 바로 보상. 운 응모권은 하루 한도(fun.ticketCapDaily) 안에서만, 넘치면 XP 로.
        data = { spinId, seg, segId, customers[], fallback, bonus }
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/cslot/pull:
    post:
      tags: [fun]
      summary: 추천 고객 슬롯 당기기 (하루 1번 + 올클리어 보너스 1번)
      description: |
        결과 단계(jackpot 트리플 · pair 더블 · mix 보통)를 가중치로 먼저 정하고, 그 단계에 맞게 오늘 아직 안 챙긴 내 고객 3명을 고른다.
        고객이 모자라 그 단계를 만들 수 없으면 낮은 단계로 바뀐다. data = { pullId, tier, reels[3], customers[3], prize { xp, ticket } }
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/crm/done:
    post:
      tags: [fun]
      summary: 룰렛 · 슬롯이 고른 고객에게 연락했어요 (화면 신고 → XP 만, 응모권 없음)
      description: |
        ref = 'r:<spinId>' 또는 's:<pullId>'. 그 결과에 있는 고객만 · 하루 같은 고객 1번. 피버 타임이면 XP 배수.
        슬롯 고객 3명을 모두 챙기면 cslotClear XP. 운영에서는 문자 · 알림톡 발송 이벤트(/internal/events)로 확정할 수 있다.
        data = { ref, customerId, xp, mult }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, ref, customerId], properties: { idem: { type: string }, ref: { type: string, example: 'r:r1' }, customerId: { type: string } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/scratch/{scratchId}/reveal:
    post:
      tags: [fun]
      summary: 스크래치 복권 긁기 (일일 미션 · 올클리어 때 1장씩 발급 · 받은 날부터 7일)
      description: 경품은 발급 때 이미 정해져 있다(서버만 앎). data = { id, prize { id, label, type }, result }
      parameters: [ { name: scratchId, in: path, required: true, schema: { type: string } } ]
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/challenge/start:
    post:
      tags: [fun]
      summary: OX 스피드 챌린지 시작 (하루 3판 · 5문제 · 10초)
      description: 문제 은행에서 갈래를 번갈아 5문제를 고른다(최근에 푼 문제는 뒤로). 답은 보내지 않는다. data = { runId, sec, items[{ id, cat, q }] }
      requestBody: { $ref: '#/components/requestBodies/Idem' }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/challenge/{runId}/answer:
    post:
      tags: [fun]
      summary: OX 챌린지 한 문제 답 (순서대로 · 시간 초과는 choice 없이)
      description: |
        점수 = 정답 base + 남은 초 × speed + (연속 정답 - 1) × combo. 마지막 문제 응답에 summary(점수 · 최고 기록 · XP · 만점 응모권)가 붙는다.
        data = { idx, correct, a, why, src, pts, score, combo, last, summary? }
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, idx], properties: { idem: { type: string }, idx: { type: integer }, choice: { type: string, nullable: true, enum: [O, X, null] }, ms: { type: integer, description: 문제를 본 뒤 답까지 걸린 시간 } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /fun/tarot/draw:
    post:
      tags: [fun]
      summary: 오늘의 타로 한 장 (하루 1번 · 메이저 아르카나 22장)
      description: 사람 · 날짜마다 정해진 세 장 중 고른 자리의 카드. 풀이 문구는 화면의 오늘의 운세 엔진(unse-engine.js)에 있다. data = { card, pick, three[3] }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [idem, pick], properties: { idem: { type: string }, pick: { type: integer, minimum: 0, maximum: 2 } } } } }
      responses: { '200': { $ref: '#/components/responses/Action' } }
  /logs:
    post:
      tags: [home]
      summary: 화면 사용 기록 묶음 (sendBeacon · docs/EVENTS.md)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { events: { type: array, maxItems: 100, items: { type: object, required: [ts, el, action], properties: { ts: { type: integer }, el: { type: string }, action: { type: string }, meta: { type: object }, v: { type: string } } } } } }
      responses: { '204': { description: 받음 } }

  /internal/events:
    post:
      tags: [internal]
      summary: 서버 간 행동 이벤트 (대화 서버 · 게시판 · 알림톡 · 추천 서비스)
      description: 내부망 + 서버 인증서. 화면 report 와 같은 idem 이면 한 번만 센다. 로또 세트의 확정(confirmed) 근거.
      security: [ { mtls: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, kind, idem, ts], properties: { userId: { type: string }, kind: { type: string }, customerId: { type: string }, ref: { type: string }, idem: { type: string }, ts: { type: integer } } }
      responses: { '202': { description: 받음 } }

  /admin/quizzes:
    get: { tags: [admin], summary: 퀴즈 목록 · 상태, responses: { '200': { description: 목록 } } }
    post:
      tags: [admin]
      summary: 퀴즈 등록 (상품 담당) → status=review
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuizAdmin' } } } }
      responses: { '201': { description: 등록 } }
  /admin/quizzes/{quizId}/review:
    put:
      tags: [admin]
      summary: 준법 검수 (approved · rejected + 사유)
      parameters: [ { $ref: '#/components/parameters/quizId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, rejected] }, note: { type: string } } } } } }
      responses: { '200': { description: 반영 } }
  /admin/quest-schedule/{date}:
    put:
      tags: [admin]
      summary: 날짜별 퀘스트 5개
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { questIds: { type: array, minItems: 5, maxItems: 5, items: { type: string } } } } } } }
      responses: { '200': { description: 반영 } }
  /admin/talks/{talkId}/review:
    put:
      tags: [admin]
      summary: 화법 검수 (ok · fixed · block + 사유, 배너 노출, 실명 표시)
      parameters: [ { $ref: '#/components/parameters/talkId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { review: { type: string, enum: [ok, fixed, block] }, head: { type: string }, body: { type: string }, blockReason: { type: string }, showRealName: { type: boolean } } } } } }
      responses: { '200': { description: 반영 } }
  /admin/config:
    get: { tags: [admin], summary: 운영 설정 (현재 · 이력), responses: { '200': { description: 설정 } } }
    put:
      tags: [admin]
      summary: 운영 설정 새 버전 (보상 · 한도 · 등수 · 인원 상한 · 경품 · 명칭 · 발급 시점 · 버디 문구)
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: config/nudge.config.json 과 같은 모양 } } } }
      responses: { '200': { description: 새 버전 } }
  /admin/lotto/{round}:
    get:
      tags: [admin]
      summary: 회차 현황 (세트 수 · 씨앗 지문/씨앗 · 당첨자(가린 이름) · 발송 상태)
      parameters: [ { name: round, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 회차 } }

components:
  securitySchemes:
    sso: { type: apiKey, in: cookie, name: MEAI_SESSION, description: 사내 SSO 세션 쿠키 + 쓰기 요청 헤더 X-CSRF-TOKEN }
    mtls: { type: http, scheme: bearer, description: 서버 간 인증 (사내 표준 서비스 토큰 또는 mTLS) }
  parameters:
    quizId: { name: quizId, in: path, required: true, schema: { type: string } }
    talkId: { name: talkId, in: path, required: true, schema: { type: string } }
  requestBodies:
    Idem:
      required: true
      content: { application/json: { schema: { type: object, required: [idem], properties: { idem: { type: string, format: uuid } } } } }
  responses:
    Action:
      description: 행동 결과 (보상 · 연출 · 새 홈)
      content: { application/json: { schema: { $ref: '#/components/schemas/ActionResult' } } }
    HomeOnly:
      description: 새 홈
      content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, home: { $ref: '#/components/schemas/Home' } } } } }
  schemas:
    ActionResult:
      type: object
      required: [ok, grants, fx, home]
      properties:
        ok: { type: boolean }
        reason: { type: string, enum: ['', already, not_bizday, limit, lotto_daily_max, not_done, no_quiz, no_talk, not_answered, same_customer, unknown_kind,
          no_plays, no_customers, no_target, no_scratch, expired, no_bank, no_run, order] }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
        fx: { type: array, items: { $ref: '#/components/schemas/Fx' } }
        data: { $ref: '#/components/schemas/FunData' }
        home: { $ref: '#/components/schemas/Home' }
    Grant:
      type: object
      required: [ts, day, type, amount, rule, label]
      properties:
        ts: { type: integer }
        day: { type: string, format: date }
        type: { type: string, enum: [ticket, lotto, shield, badge] }
        amount: { type: integer }
        rule: { type: string, example: quiz.correct }
        label: { type: string, example: 퀴즈 정답 }
        ref: { type: string }
    Fx:
      type: object
      description: 화면 연출 하나. type 별로 붙는 값이 다르다.
      required: [type]
      properties:
        type: { type: string, enum: [stamp, perfect, flame, quiz, talk, quest, mission, allclear, slot, streak, pass, rankup, badge, first, shield, cheer,
          roulette, cslot, crm, cslotClear, scratch, scratchNew, challenge, tarot, fever, bingo, capped] }
        day: { type: string }
        from: { type: integer }
        to: { description: 'flame · rankup : 숫자, cheer : 동료 id' }
        correct: { type: boolean }
        combo: { type: integer }
        rewarded: { type: boolean }
        id: { type: string }
        title: { type: string }
        ring: { type: string, enum: [come, learn, sell] }
        n: { type: integer }
        total: { type: integer }
        nums: { type: array, items: { type: integer } }
        nth: { type: integer }
        round: { type: string }
        nextRound: { type: boolean }
        days: { description: 'streak : 연속 일수, shield : 메운 날짜 목록' }
        badge: { type: string }
        step: { type: integer }
        xp: { type: integer }
        label: { type: string }
        desc: { type: string }
        kind: { type: string }
        text: { type: string }
      additionalProperties: true
    Settings:
      type: object
      properties:
        fx: { type: string, enum: [full, simple, 'off'] }
        sound: { type: boolean }
        hideRank: { type: boolean }
        buddy: { type: boolean }
        tickerSec: { type: integer, enum: [0, 5, 8, 12] }
        tickerCats: { type: array, nullable: true, items: { type: string } }
        tickerOrder: { type: string, enum: [mix, rec, random] }
        showBlocked: { type: boolean }
        showShort: { type: boolean }
    Talk:
      type: object
      properties:
        id: { type: string }
        cat: { type: string }
        catName: { type: string }
        sit: { type: string }
        tags: { type: array, items: { type: string } }
        title: { type: string }
        head: { type: string }
        body: { type: string }
        why: { type: string }
        tip: { type: string }
        author: { type: string, description: 가린 이름 (실명 표시 동의 전) }
        org: { type: string }
        grade: { type: string, enum: [rec, normal] }
        quality: { type: string, enum: [S, A, B, C, D] }
        review: { type: string, enum: [ok, fixed, block, pending] }
        blockReason: { type: string }
        noise: { type: boolean }
        src: { type: string }
        likes: { type: integer }
        usedCount: { type: integer }
        liked: { type: boolean }
        saved: { type: boolean }
        usedByMe: { type: boolean }
        copied: { type: boolean }
    TalkPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Talk' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        cats: { type: object, additionalProperties: { type: object, properties: { name: { type: string }, all: { type: integer }, banner: { type: integer } } } }
        stats: { type: object }
        hot: { type: array, items: { type: object, properties: { id: { type: string }, head: { type: string }, catName: { type: string } } } }
    Home:
      type: object
      description: 홈 요약. 필드 설명은 BLUEPRINT 5-1. 모의 서버 home() 이 같은 모양을 만든다.
      properties:
        serverTime: { type: integer }
        today: { type: string, format: date }
        hm: { type: string, example: '09:12' }
        dow: { type: integer }
        bizDay: { type: boolean }
        holiday: { type: string }
        version: { type: string }
        user: { type: object, properties: { id: { type: string }, name: { type: string }, branch: { type: string }, hq: { type: string }, role: { type: string }, joinMonth: { type: integer }, rookie: { type: boolean } } }
        labels: { type: object, properties: { lotto: { type: string }, ticket: { type: string }, shield: { type: string } } }
        settings: { $ref: '#/components/schemas/Settings' }
        streak:
          type: object
          properties:
            current: { type: integer }
            best: { type: integer }
            todayLit: { type: boolean }
            nextStreak: { type: integer }
            nextMilestone: { type: integer, nullable: true }
            nextBadge: { type: object, nullable: true, properties: { id: { type: string }, label: { type: string }, n: { type: integer } } }
            atRisk: { type: boolean }
            shields: { type: integer }
            last10: { type: array, items: { type: object, properties: { day: { type: string }, state: { type: string, enum: [lit, shield, miss, today] } } } }
            topPercent: { type: integer }
        week:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
            days: { type: array, items: { type: object, properties: { day: { type: string }, dow: { type: integer }, state: { type: string, enum: [stamp, lit, shield, miss, today, future, holiday] }, holiday: { type: string } } } }
            attended: { type: integer }
            bizDays: { type: integer }
            perfect: { type: boolean }
            xp: { type: integer }
        attendedToday: { type: boolean }
        wallet: { type: object, properties: { tickets: { type: integer }, todayTickets: { type: integer }, sets: { type: integer }, shields: { type: integer }, badges: { type: integer }, today: { type: array, items: { $ref: '#/components/schemas/Grant' } }, coffee: { type: object } } }
        quests:
          type: object
          properties:
            date: { type: string }
            items: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, ring: { type: string }, note: { type: string }, go: { type: string }, progress: { type: integer }, target: { type: integer }, done: { type: boolean } } } }
            done: { type: integer }
            total: { type: integer }
            rings: { type: object, additionalProperties: { type: object, properties: { label: { type: string }, color: { type: string }, done: { type: integer }, total: { type: integer } } } }
            need: { type: integer }
            mission: { type: boolean }
            allclear: { type: boolean }
            next: { type: object, properties: { date: { type: string }, titles: { type: array, items: { type: string } }, changed: { type: boolean } } }
        quiz:
          type: object
          description: 답하기 전에는 answer · explain · source 를 보내지 않는다
          properties:
            id: { type: string }
            type: { type: string, enum: [ox, choice] }
            category: { type: string }
            question: { type: string }
            options: { type: array, nullable: true, items: { type: string } }
            open: { type: boolean }
            openAt: { type: integer }
            answered: { type: boolean }
            combo: { type: integer }
            choice: { type: string }
            correct: { type: boolean }
            explained: { type: boolean }
            answer: { type: string }
            explain: { type: array, items: { type: string } }
            source: { type: string }
            ask: { type: string }
            stats: { type: object, properties: { branchRate: { type: integer }, companyRate: { type: integer }, participants: { type: integer } } }
        talk: { type: object, properties: { today: { $ref: '#/components/schemas/Talk' }, ticker: { type: array, items: { type: object } }, copiedToday: { type: boolean }, total: { type: integer }, banner: { type: integer } } }
        lotto: { $ref: '#/components/schemas/Lotto' }
        league: { $ref: '#/components/schemas/League' }
        team: { type: object, properties: { branch: { type: string }, title: { type: string }, metric: { type: string }, value: { type: integer }, target: { type: integer }, members: { type: integer }, joined: { type: integer } } }
        compare: { type: object, properties: { metric: { type: string }, me: { type: integer }, branchAvg: { type: number }, nonUser: { type: number }, ratio: { type: number } } }
        reco: { type: object, properties: { issued: { type: object, additionalProperties: { type: object, properties: { opened: { type: boolean }, lotto: { type: boolean } } } }, todayIssued: { type: integer }, dailyMax: { type: integer }, issueOn: { type: string } } }
        buddy: { type: object, nullable: true, properties: { id: { type: string }, mascot: { type: string }, text: { type: string }, cta: { type: object, properties: { label: { type: string }, go: { type: string } } } } }
        notices: { type: object, properties: { unread: { type: integer } } }
        onboarding: { type: object, nullable: true, properties: { joinMonth: { type: integer }, steps: { type: array, items: { type: object, properties: { kind: { type: string }, title: { type: string }, text: { type: string }, done: { type: boolean } } } } } }
        recap: { type: object, properties: { available: { type: boolean }, week: { type: string }, seen: { type: boolean } } }
        myCustomers: { type: object }
        fun: { $ref: '#/components/schemas/Fun' }
    FunData:
      type: object
      nullable: true
      description: 행운 존 게임 결과 (행동마다 붙는 값이 다르다 · 각 경로 설명 참고). 다른 행동은 null.
