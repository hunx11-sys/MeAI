            odds: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, pct: { type: number } } } }
            prizes: { type: object }
            xpContact: { type: integer }
            clearXp: { type: integer }
            pulls: { type: array, items: { type: object, properties: { id: { type: string }, tier: { type: string }, reels: { type: array, items: { type: string } }, cleared: { type: boolean }, customers: { type: array, items: { $ref: '#/components/schemas/FunCustomer' } } } } }
        scratch: { type: object, properties: { cards: { type: array, items: { type: object, properties: { id: { type: string }, from: { type: string }, day: { type: string } } } }, today: { type: array, items: { type: object } }, odds: { type: array, items: { type: object } }, issueOn: { type: array, items: { type: string } } } }
        challenge: { type: object, properties: { best: { type: integer }, runsToday: { type: integer }, perfectToday: { type: boolean }, n: { type: integer }, sec: { type: integer }, bank: { type: integer }, cats: { type: object }, max: { type: integer } } }
        tarot: { type: object, properties: { today: { type: object, nullable: true, properties: { card: { type: integer }, pick: { type: integer }, three: { type: array, items: { type: integer } } } }, cards: { type: integer } } }
        bingo:
          type: object
