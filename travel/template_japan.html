<!DOCTYPE html>
<html lang="/*LANG*/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFCFA">
<meta name="format-detection" content="telephone=no">
<title>/*TITLE*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--FONTS-->
<style id="leaflet-css">/*LEAFLET_CSS*/</style>
<style>
/* 레이아웃 개념 : 한 손으로 쓰는 세로 한 줄. 출발 공항 → 일본 지도 → 목적지 카드 → 일정. 글꼴은 Pretendard(OFL, 무료)·Noto Sans(OFL) 만 쓴다. 제목은 같은 글꼴을 굵게. */
:root{
  --bg:#FFFCFA; --surface:#FFFFFF; --fill:#F8F1ED; --fill-2:#F1E7E1; --line:#EFE3DD; --line-2:#E2D3CB;
  --ink:#2B2320; --ink-2:#6B5E58; --ink-3:#A3968F; --ink-4:#CFC4BE;
  --rose:#D9516E; --rose-deep:#B63B57; --rose-soft:#FBE7EC; --rose-pale:#FDF4F6;
  --sage:#5F9272; --sage-deep:#47765A; --sage-soft:#E6F1E9;
  --sky:#4E8CC4; --sky-deep:#38689A; --sky-soft:#E5EFF9;
  --sun:#D9A62E; --sun-deep:#A87C14; --sun-soft:#FBF1D6;
  --plum:#7A5E90; --plum-soft:#EFE8F4;
  --coral:#E36A4C; --coral-deep:#B84D33; --coral-soft:#FCE9E3;
  --mint:#3BA39A; --mint-soft:#E2F3F1;
  --display:/*FONT_STACK*/;
  --body:/*FONT_STACK*/;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --shadow:0 8px 28px rgba(90,52,44,.08);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{word-break:keep-all;overflow-wrap:anywhere;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip;touch-action:manipulation}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;line-height:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:var(--rose-deep)}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px));padding-inline:0}
.hide{display:none!important}

/* ── 상단 바 ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,252,250,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
.topbar .brand{font-family:var(--display);font-weight:700;letter-spacing:-.015em;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{font-family:var(--body);font-size:11.5px;color:var(--ink-3);margin-left:6px;font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:var(--r-full);background:var(--fill);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn .lc{position:absolute;right:-2px;bottom:-2px;font-size:8.5px;font-weight:700;background:var(--rose);color:#fff;border-radius:6px;padding:1px 4px;line-height:1.2;letter-spacing:.02em}
.langmenu{position:fixed;right:14px;top:calc(62px + env(safe-area-inset-top,0px));z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px;min-width:190px;display:none}
.langmenu.on{display:block}
.langmenu .lt{font-size:11px;font-weight:500;color:var(--ink-3);padding:6px 10px 4px;letter-spacing:.04em}
.langmenu a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
.langmenu a:hover{background:var(--fill)}
.langmenu a[aria-current="true"]{background:var(--rose-soft);color:var(--rose-deep)}
.langmenu a small{font-size:11px;color:var(--ink-3);font-weight:400}
.scrim{position:fixed;inset:0;z-index:65;display:none}
.scrim.on{display:block}

/* ── 홈 히어로 ── */
.hero{padding:26px 18px 10px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--rose);text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.3;letter-spacing:-.03em;margin-top:8px}
.hero h1 em{font-style:normal;color:var(--rose)}
.hero .lead{margin-top:10px;font-size:14px;color:var(--ink-2);line-height:1.7}
.q{margin-top:22px}
.q .qt{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.q .qt b{font-family:var(--display);font-size:16px;font-weight:700}
.q .qt span{font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px 6px;margin-inline:-18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.rose[aria-pressed="true"]{background:var(--rose);border-color:var(--rose)}
.chip:active{transform:scale(.97)}
.chip small{font-weight:400;color:inherit;opacity:.7;margin-left:3px}

/* ── 일본 지도 ── */
.mapcard{margin:18px 18px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
.mapcard .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
.mapcard .mh b{font-family:var(--display);font-size:15px;font-weight:700}
.mapcard .mh span{font-size:11.5px;color:var(--ink-3);text-align:right}
.jpmap{display:block;width:100%;height:auto;padding:6px 8px 2px}
.jpmap .land{fill:var(--fill-2);stroke:#fff;stroke-width:.8;stroke-linejoin:round}
.jpmap .land.kr{fill:#EDE4E0}
.jpmap .arc{fill:none;stroke:var(--rose);stroke-width:1.1;opacity:.45;stroke-linecap:round}
.jpmap .arc.season{stroke:var(--sun);stroke-dasharray:3 2}
.jpmap .arc.charter{stroke:var(--plum);stroke-dasharray:1.5 2}
.jpmap .arc.tbc{stroke:var(--ink-3);stroke-dasharray:1 2.5;opacity:.5}
.jpmap .dot{cursor:pointer}
.jpmap .dot circle.c{stroke:#fff;stroke-width:1.4}
.jpmap .dot.on circle.c{fill:var(--rose)}
.jpmap .dot.season circle.c{fill:var(--sun)}
.jpmap .dot.charter circle.c{fill:var(--plum)}
.jpmap .dot.off circle.c{fill:var(--ink-4)}
.jpmap .dot.tbc circle.c{fill:var(--ink-3)}
.jpmap .dot.sel circle.halo{fill:var(--rose);opacity:.18}
.jpmap .origin circle{fill:var(--sky);stroke:#fff;stroke-width:1.6}
.jpmap .origin text{font-size:9.5px;font-weight:700;fill:var(--sky-deep)}
.jpmap .rg{font-size:8.6px;fill:var(--ink-3);letter-spacing:.04em}
.jpmap .inset{fill:none;stroke:var(--line-2);stroke-dasharray:2 2}
.jpmap .insetlbl{font-size:8px;fill:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 16px 14px;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.maptip{margin:0 16px 14px;padding:11px 13px;border-radius:var(--r-md);background:var(--rose-pale);font-size:13px;color:var(--ink-2);line-height:1.55}
.maptip b{color:var(--ink);font-weight:700}
.maptip .go{display:inline-block;margin-left:6px;color:var(--rose-deep);font-weight:500}

/* ── 목적지 목록 ── */
.filters{padding:20px 18px 6px}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fbar b{font-family:var(--display);font-size:17px;font-weight:700}
.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-full);padding:3px}
.seg button{padding:6px 12px;border-radius:var(--r-full);font-size:12.5px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.rghead{display:flex;align-items:center;gap:10px;padding:22px 18px 8px}
.rghead b{font-family:var(--display);font-size:18px;font-weight:700}
.rghead span{font-size:12px;color:var(--ink-3)}
.rghead::after{content:"";flex:1;height:1px;background:var(--line)}
.dlist{display:grid;gap:10px;padding:0 18px}
.dcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 13px;transition:transform .12s,border-color .15s;position:relative}
.dcard:active{transform:scale(.985)}
.dcard.flash{border-color:var(--rose);box-shadow:0 0 0 4px var(--rose-soft)}
.dcard .row{display:flex;gap:12px;align-items:flex-start}
.dcard .nm{flex:1;min-width:0}
.dcard h3{font-family:var(--display);font-size:19px;line-height:1.3;letter-spacing:-.02em;font-weight:700}
.dcard h3 small{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}
.dcard .tg{margin-top:3px;font-size:13px;color:var(--ink-2)}
.dcard .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:var(--r-full);background:var(--fill);color:var(--ink-2);line-height:1.4}
.tag.rose{background:var(--rose-soft);color:var(--rose-deep)}
.tag.sage{background:var(--sage-soft);color:var(--sage-deep)}
.tag.sky{background:var(--sky-soft);color:var(--sky-deep)}
.tag.sun{background:var(--sun-soft);color:var(--sun-deep)}
.tag.plum{background:var(--plum-soft);color:var(--plum)}
.tag.coral{background:var(--coral-soft);color:var(--coral-deep)}
.tag.mint{background:var(--mint-soft);color:var(--mint)}
.tag.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}
.tag.kmark{background:var(--sky-soft);color:var(--sky-deep)}
/* 해시태그(특징·장점) : 알록달록 */
.hts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.ht{font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-full);line-height:1.4;letter-spacing:-.01em}
.ht-0{background:#FBE7EC;color:#B63B57}.ht-1{background:#E6F1E9;color:#3F7A55}.ht-2{background:#E5EFF9;color:#2F6AA3}.ht-3{background:#FBF1D6;color:#A3730A}.ht-4{background:#EFE8F4;color:#6E4E8C}.ht-5{background:#E2F3F1;color:#2A8A80}.ht-6{background:#FCE9E3;color:#B84D33}.ht-7{background:#EEF0D6;color:#6E7A1A}
.flight{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 11px;border-radius:var(--r-md);background:var(--rose-pale);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.flight.off{background:var(--fill);color:var(--ink-3)}
.flight svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--rose)}
.flight.off svg{color:var(--ink-4)}
.flight b{color:var(--ink);font-weight:700}
.flight .num{font-weight:500}
.nights{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.nights span{font-size:12px;font-weight:500;padding:5px 10px;border-radius:var(--r-full);border:1px solid var(--line-2);color:var(--ink-2)}
.nights span.hit{border-color:var(--rose);color:var(--rose-deep);background:var(--rose-pale)}

/* ── 목적지 화면 ── */
.dhero{padding:22px 18px 6px}
.dhero .top{display:flex;gap:14px;align-items:center}
.dhero h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.25;letter-spacing:-.03em}
.dhero .jline{font-size:13px;color:var(--ink-3);margin-top:3px}
.dhero .tagline{margin-top:14px;font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:17px;color:var(--rose-deep);line-height:1.5}
.dhero .intro{margin-top:8px;font-size:14px;color:var(--ink-2);line-height:1.75}
.dhero .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.months{display:flex;gap:3px;margin-top:14px}
.months span{flex:1;text-align:center;font-size:10px;padding:5px 0;border-radius:6px;background:var(--fill);color:var(--ink-3)}
.months span.on{background:var(--rose-soft);color:var(--rose-deep);font-weight:700}
.months-lbl{margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.season{margin-top:6px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.card{margin:16px 18px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 15px 14px}
.card h2{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:auto}
.route{display:flex;flex-direction:column;gap:8px}
.route .ap{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;flex-wrap:wrap}
.route .ap .code{font-family:var(--display);font-size:14px;font-weight:700;color:var(--rose-deep)}
.rline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--fill);font-size:13px;color:var(--ink-2)}
.rline .al{color:var(--ink);font-weight:500}
.rline .st{margin-left:auto}
.noroute{padding:10px 12px;border-radius:var(--r-md);background:var(--fill);font-size:13px;color:var(--ink-3)}
.access{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px}
.access .ah{font-size:12px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
.access li{display:flex;gap:8px;font-size:13px;padding:5px 0;color:var(--ink-2);flex-wrap:wrap}
.access li b{color:var(--ink);font-weight:500;min-width:0}
.access li .num{margin-left:auto;white-space:nowrap;color:var(--ink)}
details.more{margin-top:10px}
details.more summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--rose-deep);font-weight:500;display:inline-flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:2px;margin-top:-3px}
details.more[open] summary::after{transform:rotate(-135deg);margin-top:3px}
details.more .body{margin-top:8px;display:flex;flex-direction:column;gap:6px}

/* ── 박 수 · 플랜 선택 ── */
.pick{padding:20px 18px 0}
.pick .lbl{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick .lbl span{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:400}
.nseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.nseg button{padding:11px 4px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);line-height:1.2}
.nseg button small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nseg button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.nseg button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.vchips{margin-top:12px}
.psum{margin:16px 18px 0;padding:16px 16px 15px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--rose-pale),var(--sun-soft));border:1px solid var(--line)}
.psum .k{font-size:12px;font-weight:500;color:var(--rose-deep)}
.psum h2{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.3;margin-top:4px;letter-spacing:-.02em}
.psum p{margin-top:7px;font-size:13.5px;color:var(--ink-2);line-height:1.7}

/* ── 일차 타일 ── */
.dgrid{display:grid;gap:7px;padding:16px 18px 0;grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.tile{background:var(--fill);border-radius:var(--r-md);padding:10px 4px 9px;text-align:center;transition:background .15s}
.tile .n{display:block;font-size:10.5px;color:var(--ink-3);font-weight:500}
.tile .l{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--display);font-size:13px;font-weight:700;margin-top:2px;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.tile[aria-pressed="true"]{background:var(--rose-soft)}
.tile[aria-pressed="true"] .l{color:var(--rose-deep)}
.tile[aria-pressed="true"] .n{color:var(--rose)}
.dayhead{padding:20px 18px 0;scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
.dayhead .kicker{font-size:12.5px;font-weight:500;color:var(--rose)}
.dayhead h2{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin-top:4px}
.dayhead p{margin-top:7px;font-size:14px;color:var(--ink-2);line-height:1.7}
.notice{display:flex;gap:9px;margin:12px 0 0;padding:12px 14px;border-radius:var(--r-md);background:var(--sun-soft);color:var(--sun-deep);font-size:13px;line-height:1.6}
.notice.warn{background:var(--coral-soft);color:var(--coral-deep)}
.notice svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.daymap{scroll-margin-top:calc(80px + env(safe-area-inset-top,0px));margin:14px 18px 0;border-radius:var(--r-lg);overflow:hidden;background:var(--fill);border:1px solid var(--line);position:relative}
.daymap .lmap{height:240px;width:100%}
.daymap .sketch{width:100%;height:auto;display:block;background:var(--surface)}
.sketch .ln{fill:none;stroke:var(--rose);stroke-width:1.5;stroke-dasharray:4 3}
.sketch .pt circle{fill:var(--rose);stroke:#fff;stroke-width:2}
.sketch .pt text{font-size:9px;fill:#fff;font-weight:700;text-anchor:middle}
.sketch .nm{font-size:10px;fill:var(--ink-2);font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.maphint{margin:7px 18px 0;font-size:11.5px;color:var(--ink-3)}
.leaflet-container{font-family:var(--body);background:var(--fill)}
.leaflet-tile-pane{filter:saturate(.55) brightness(1.03)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow)}
.leaflet-popup-content{margin:9px 13px;font-size:13px;line-height:1.5}
.leaflet-popup-content b{font-family:var(--display);font-weight:700}
.pin{width:24px;height:24px;border-radius:50%;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.on{background:var(--ink);transform:scale(1.15)}

/* ── 타임라인 ── */
.stops{margin-top:12px}
.stops>li{position:relative;padding:0 18px}
.track{position:absolute;left:49px;top:0;bottom:0;border-left:2px dotted var(--line-2)}
.stops>li:first-child .track{top:40px}
.stops>li:last-child .track{display:none}
.scard{position:relative;display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 13px 12px;margin:8px 0;transition:border-color .15s}
.scard.on{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.c-shrine{background:#FBE7EC;color:#B63B57}.ic.c-castle{background:#EDE8E1;color:#6C5A48}.ic.c-view{background:#E5EFF9;color:#38689A}.ic.c-nature{background:#E6F1E9;color:#47765A}
.ic.c-park{background:#EAF3E3;color:#5A8A3E}.ic.c-street{background:#F3ECE4;color:#8A5A3A}.ic.c-market{background:#FBF1D6;color:#A87C14}.ic.c-onsen{background:#FCE9E3;color:#B84D33}
.ic.c-theme{background:#EFE8F4;color:#7A5E90}.ic.c-museum{background:#E9ECF4;color:#4F5C86}.ic.c-sea{background:#E3F2F6;color:#2E7E96}.ic.c-night{background:#E5E4F0;color:#44406E}
.ic.c-shop{background:#FBE7EC;color:#B63B57}.ic.c-kids{background:#FBF1D6;color:#C8781A}.ic.c-cafe{background:#F3ECE4;color:#8A5A3A}.ic.c-station{background:#E9ECF4;color:#4F5C86}
.ic.c-airport{background:#E5EFF9;color:#38689A}.ic.c-hotel{background:#EFE8F4;color:#7A5E90}.ic.c-food{background:#FBF1D6;color:#A87C14}.ic.c-free{background:var(--fill);color:var(--ink-3)}
.sinfo{flex:1;min-width:0}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tm{font-family:var(--display);font-size:16px;font-weight:700;color:var(--rose-deep);line-height:1;font-variant-numeric:tabular-nums}
.tline .tags{display:flex;gap:4px;flex-wrap:wrap}
.scard h3{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.02em;margin-top:5px}
.scard .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.scard .desc{margin-top:7px;font-size:13.5px;color:var(--ink-2);line-height:1.65}
.scard .note{margin-top:7px;font-size:13.5px;color:var(--ink);line-height:1.6}
.box{margin-top:9px;padding:10px 12px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.6}
.box.tip{background:var(--fill);color:var(--ink-2)}
.box.kid{background:var(--sun-soft);color:var(--sun-deep)}
.box.warn{background:var(--coral-soft);color:var(--coral-deep)}
.box b{font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.meta span b{color:var(--ink-2);font-weight:500}
.go{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:500;color:var(--rose-deep);text-decoration:none}
.go svg{width:13px;height:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{padding:7px 11px;border-radius:var(--r-full);border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.rmini{margin-top:10px;padding:11px 12px;border-radius:var(--r-md);background:var(--sun-soft)}
.rmini .rn{font-family:var(--display);font-size:15px;font-weight:700}
.rmini .rn small{font-family:var(--body);font-size:11px;color:var(--ink-3);margin-left:6px;font-weight:400}
.rmini .rs{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.rmini .rd{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.rmini .meta{margin-top:6px}
.rmini .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.move{padding:2px 18px}
.move span{display:inline-flex;align-items:center;gap:7px;margin-left:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-full);padding:5px 12px 5px 9px;font-size:12px;color:var(--ink-2);max-width:calc(100% - 30px)}
.move span svg{width:14px;height:14px;flex:0 0 auto;color:var(--ink-3);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.move span em{font-style:normal;font-weight:500;color:var(--ink)}
.free{padding:4px 18px}
.free p{margin-left:30px;font-size:13px;color:var(--ink-3);padding:6px 0}
.free p b{color:var(--ink-2);font-weight:600;font-family:var(--display)}

/* ── 아코디언 ── */
.accs{margin:24px 18px 0;border-top:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line);scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
.acc>summary{list-style:none;cursor:pointer;padding:16px 2px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .cnt{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:400}
.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-4);border-bottom:2px solid var(--ink-4);transform:rotate(45deg);transition:transform .2s;flex:0 0 auto}
.acc[open]>summary::after{transform:rotate(-135deg)}
.abody{padding:0 2px 20px}
.abody p{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.abody p+p{margin-top:8px}
.abody h4{font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--rose-deep);margin:14px 0 6px}
.abody h4:first-child{margin-top:0}
.hcard{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hcard:last-child{border-bottom:0}
.hcard .hi{flex:1;min-width:0}
.hcard .hn{font-family:var(--display);font-size:15.5px;font-weight:700;line-height:1.35}
.hcard .ha{font-size:12px;color:var(--ink-3);margin-top:2px}
.hcard .hd{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.hcard .pts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hcard .pr{font-size:12.5px;color:var(--ink);margin-top:6px;font-weight:500}
table.bt{width:100%;border-collapse:collapse;font-size:13.5px}
.bt th,.bt td{text-align:left;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.bt th{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.bt td:last-child,.bt th:last-child{text-align:right;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;padding-left:10px}
.bt td small{display:block;font-size:11.5px;color:var(--ink-3)}
.bt tr.total td{border-bottom:0;padding-top:14px}
.bt tr.total td:first-child{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink)}
.bt tr.total td:last-child{font-family:var(--display);font-size:20px;font-weight:800;color:var(--rose-deep)}
.note,.abody p.note{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}
.checks li{position:relative;padding:10px 0 10px 28px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.6;cursor:pointer}
.checks li:last-child{border-bottom:0}
.checks li::before{content:"";position:absolute;left:0;top:14px;width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line-2);background:#fff}
.checks li.done{color:var(--ink-4);text-decoration:line-through}
.checks li.done::before{background:var(--rose);border-color:var(--rose)}
.checks li.done::after{content:"";position:absolute;left:5px;top:16px;width:4px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.bp{padding:11px 0;border-bottom:1px solid var(--line)}
.bp:last-child{border-bottom:0}
.bp .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bp .bh b{font-family:var(--display);font-size:15px;font-weight:700}
.bp .bd{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .ic{width:38px;height:38px;border-radius:12px}
.ritem .ic svg{width:19px;height:19px}
.ritem .ri{flex:1;min-width:0}
.ritem .rn{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.35}
.ritem .rn small{font-family:var(--body);font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:400}
.ritem .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ritem .rd{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.55}
.altcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.altcard:last-child{border-bottom:0}
.altcard .ai{flex:1;min-width:0}
.altcard .an{font-family:var(--display);font-size:16px;font-weight:700}
.altcard .ar{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.altcard .af{font-size:12px;color:var(--ink-3);margin-top:4px}
.altcard .arrow{color:var(--ink-4)}
.altcard .arrow svg{width:16px;height:16px}
.srcs li{font-size:11.5px;color:var(--ink-3);padding:3px 0;word-break:break-all}
.srcs a{color:var(--ink-3)}

/* ── 하단 바 · 토스트 ── */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom,0px))}
.bottombar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bottombar .amt{flex:1;min-width:0;line-height:1.25}
.bottombar .k{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottombar .v{display:block;font-family:var(--display);font-size:clamp(15px,4.6vw,19px);font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bottombar .v small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:0;line-height:1.2;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:var(--r-md);background:var(--rose);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97);background:var(--rose-deep)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-full);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 36px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{padding:28px 18px 8px;font-size:11.5px;color:var(--ink-3);line-height:1.75}
footer a{color:var(--ink-3)}
.empty{margin:14px 18px 0;padding:28px 18px;text-align:center;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--ink-2);font-size:14px;line-height:1.7}
.empty b{display:block;font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);margin-bottom:4px}
/* ── 도시 색(프로필 color) ── */
.c-rose{--c:var(--rose);--cd:var(--rose-deep);--cs:var(--rose-pale)}
.c-sage{--c:var(--sage);--cd:var(--sage-deep);--cs:var(--sage-soft)}
.c-sky{--c:var(--sky);--cd:var(--sky-deep);--cs:var(--sky-soft)}
.c-sun{--c:var(--sun);--cd:var(--sun-deep);--cs:var(--sun-soft)}
.c-plum{--c:var(--plum);--cd:var(--plum);--cs:var(--plum-soft)}
.c-coral{--c:var(--coral);--cd:var(--coral-deep);--cs:var(--coral-soft)}
.c-mint{--c:var(--mint);--cd:#2A7F77;--cs:var(--mint-soft)}

/* ── 도시 검색 ── */
.search{margin-top:20px;position:relative}
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-full);padding:0 6px 0 15px;box-shadow:var(--shadow);transition:border-color .15s}
.sbox:focus-within{border-color:var(--rose)}
.sbox svg{width:18px;height:18px;color:var(--ink-3);flex:0 0 auto}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:13px 0;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--ink-3)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .sx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);background:var(--fill)}
.sbox .sx svg{width:14px;height:14px}
.sex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sex .k{font-size:12px;color:var(--ink-3);margin-right:2px}
.sex button{font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:var(--r-full);background:var(--fill);color:var(--ink-2)}
.sres{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.sres:empty{display:none}
.sitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem:active{background:var(--fill)}
.sitem .ill{width:46px;height:46px;border-radius:13px}
.sitem .stx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.sitem .stx b{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.sitem .stx b small{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--ink-3);margin-left:5px}
.sitem .stx span{font-size:12.5px;color:var(--cd,var(--ink-2));font-weight:500}
.sitem .stx em{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .stx em i{font-style:normal;font-weight:600;color:var(--ink-2)}
.sitem .gt{color:var(--ink-4);flex:0 0 auto}
.sitem .gt svg{width:16px;height:16px}
.snone{padding:16px 14px;font-size:13px;color:var(--ink-3);line-height:1.6}
.snone b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.smore{padding:9px 14px;font-size:12px;color:var(--ink-3);background:var(--fill)}

/* ── 도시 그림 · 위치 지도 ── */
.ill{flex:0 0 auto;display:block;width:64px;height:64px;border-radius:18px;overflow:hidden;background:var(--fill);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.ill svg{width:100%;height:100%;display:block}
.ill.sm{width:52px;height:52px;border-radius:15px}
.ill.lg{width:88px;height:88px;border-radius:24px;box-shadow:0 6px 18px rgba(90,52,44,.12)}
.loc{display:block;flex:0 0 auto;width:52px;height:auto;color:#D6C3B9;overflow:visible}
.loc .lr{fill:var(--c,var(--rose));opacity:.22}
.loc .ld{fill:var(--c,var(--rose));stroke:#fff;stroke-width:9}
.loc.lg{width:118px}
.loc.lg .ld{stroke-width:6}

/* ── 목적지 카드(개편) ── */
.dcard .row{align-items:center}
.dcard .vibe{margin-top:3px;font-family:var(--display);font-size:14px;font-weight:600;color:var(--cd,var(--rose-deep));letter-spacing:-.01em;line-height:1.4}
.wstrip{display:flex;align-items:center;gap:10px;margin-top:11px;padding:8px 12px 8px 8px;border-radius:var(--r-md);background:var(--cs,var(--fill))}
.wstrip p{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.kf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.kf div{padding:8px 9px 9px;border-radius:var(--r-md);background:var(--fill);font-size:12.5px;line-height:1.4;color:var(--ink);font-weight:500;letter-spacing:-.01em}
.kf div i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.02em;margin-bottom:3px}
.kf .eat i{color:var(--coral-deep)}.kf .see i{color:var(--sky-deep)}.kf .do i{color:var(--sage-deep)}
.kf .eat{background:#FDF1EC}.kf .see{background:#EEF4FB}.kf .do{background:#EEF6F0}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.dfoot .nights{margin-top:0}
.bf{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.bf span{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:var(--r-full);background:var(--cs,var(--fill));color:var(--cd,var(--ink-2))}

/* ── 홈 지도 : 도시 핀 · 지역 확대 ── */
.rchips{padding:10px 16px 0;margin-inline:0;scroll-padding-inline:16px}
.rchips .chip{padding:6px 12px;font-size:12.5px}
.jpmap .land,.jpmap .arc,.jpmap .inset{vector-effect:non-scaling-stroke}
.jpmap .cpin{cursor:pointer}
.jpmap .cpin .pc{stroke:#fff}
.jpmap .cpin.on .pc{fill:var(--rose)}
.jpmap .cpin.season .pc{fill:var(--sun)}
.jpmap .cpin.charter .pc{fill:var(--plum)}
.jpmap .cpin.tbc .pc,.jpmap .cpin.off .pc{fill:var(--ink-3)}
.jpmap .cpin.dim{opacity:.35}
.jpmap .cpin.sel .ph{fill:var(--rose);opacity:.2}
.jpmap .pl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:#fff;stroke-linejoin:round;letter-spacing:-.02em;transition:opacity .25s}
.jpmap .cpin.sel .pl{fill:var(--rose-deep);font-weight:800}
.jpmap.zm .arc{opacity:.16}
.jpmap .ll{stroke:var(--ink-3);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.7;transition:opacity .25s}
.jpmap.anim .pl,.jpmap.anim .rg,.jpmap.anim .ll{opacity:0;transition:none}
.maptip.dtip{display:flex;gap:12px;align-items:flex-start}
.maptip.dtip .ill{width:52px;height:52px;border-radius:15px}
.maptip.dtip .vb{color:var(--cd,var(--rose-deep));font-weight:600}
.maptip.dtip .wh{font-size:12px;color:var(--ink-3);margin-top:2px}
.maptip.dtip .fl{margin-top:5px;font-size:12.5px}

/* ── 목적지 '한눈에' ── */
.dhero .vibe{margin-top:5px;font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--cd,var(--rose-deep));letter-spacing:-.01em;line-height:1.4}
.glance{margin-top:16px;padding:14px;border-radius:var(--r-lg);background:var(--cs,var(--fill));border:1px solid var(--line)}
.glance .gh{font-size:12px;font-weight:700;color:var(--cd,var(--rose-deep));letter-spacing:.04em;margin-bottom:8px}
.glance .gw{display:flex;gap:12px;align-items:center}
.glance .gw p{font-size:13.5px;color:var(--ink);line-height:1.6;font-weight:500}
.glance .gw p small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-bottom:2px}
.glance .kf div{background:rgba(255,255,255,.75)}
.glance .bf{margin-top:10px}
.glance .bf span{background:#fff}
.glance .vs{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.1);font-size:12.5px;color:var(--ink-2);line-height:1.6}
.glance .vs b{color:var(--ink);font-weight:700;margin-right:4px}
.glance .vs button{color:var(--rose-deep);font-weight:600;margin-left:4px;font-size:12.5px}
@media (max-width:359px){.kf{grid-template-columns:1fr}.loc.lg{width:96px}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:640px){.app{padding-top:12px}}
</style>
</head>
<body>

  const spots = (g.spots || []).filter(s => s.cat !== 'airport' && s.cat !== 'station').map(s => `<div class="ritem"><div class="ic c-${esc(s.cat)}">${ico(s.cat)}</div><div class="ri"><div class="rn">${esc(s.name)}<small>${LANG === 'ja' ? '' : esc(s.name_ja || '')}</small>${s.must ? ` <span class="tag rose">${esc(T('must'))}</span>` : ''}</div><div class="rs">${esc(s.area || '')} · ${s.fee_yen === 0 ? esc(T('free')) : s.fee_yen > 0 ? yen(s.fee_yen) : esc(T('fee_tbd'))} · ${fmtMin(s.duration_min || 60)}</div><div class="rd">${rich(s.desc || '')}${s.closed && s.closed !== '없음' ? ` <b>${esc(T('closed'))} ${esc(hText(s.closed))}</b>` : ''}</div><a class="go" href="${gmap(s.maps_q || s.name_ja || s.name, [s.lat, s.lng])}" target="_blank" rel="noopener">${svgPin}${esc(T('gmap'))}</a></div></div>`).join('');
  const altList = (g.nearby_alternatives || []).filter(x => own(GUIDES, x.key));
  const alts = altList.map(x => { const ag = GUIDES[x.key]; const bb = bestRoute(st.origin, ag); const a = bb && AP[bb.iata];
    return `<button class="altcard" data-act="open" data-v="${esc(ag.key)}">${illHtml(ag, 'sm')}<div class="ai"><div class="an">${esc(ag.name)}</div><div class="ar">${rich(x.reason || '')}</div><div class="af">${bb ? `${esc(T('from_to', { origin: krName(st.origin), to: apCity(a) }))} ${fmtMin(bb.r.flight_minutes)} · ${esc(airlineText(bb.r.airlines))}` : esc(T('no_direct', { origin: krName(st.origin) }))} · ${(ag.plans || []).map(p => esc(nd(p.nights))).join(' / ')}</div></div><span class="arrow">${svgNext}</span></button>`; }).join('');
  const season = `<p>${esc(g.season_notes || '')}</p>${g.getting_around ? `<h4>${esc(T('getting_around'))}</h4><p>${rich(g.getting_around)}</p>` : ''}${g.transport_pass ? `<h4>${esc(T('pass'))}</h4><p>${rich(g.transport_pass)}</p>` : ''}`;
  const srcs = (g.sources || []).slice(0, 40).map(u => /^https?:\/\//i.test(String(u)) ? `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>` : `<li>${esc(u)}</li>`).join('');
  const acc = (id, title, cnt, body, open) => `<details class="acc" id="acc-${id}" ${open ? 'open' : ''}><summary>${esc(title)}${cnt ? `<span class="cnt">${esc(cnt)}</span>` : ''}</summary><div class="abody">${body}</div></details>`;
  return acc('hotel', T('acc_hotel'), T('n_places', { n: (g.hotels || []).length }), hotels || `<p>${esc(T('no_hotel'))}</p>`) +
    acc('budget', T('acc_budget'), plan ? nd(plan.nights) : '', budget) +
    acc('check', T('acc_check'), T('n_items', { n: checks.length }), checkHtml) +
    acc('bplan', T('acc_bplan'), T('n_places', { n: (g.bplan || []).length }), bplan || `<p>${esc(T('no_bplan'))}</p>`) +
    acc('alt', T('acc_alt'), T('n_places', { n: altList.length }), alts || `<p>${esc(T('no_alt'))}</p>`) +
    acc('food', T('acc_food'), T('n_places', { n: (g.restaurants || []).length }), `<div class="rlist">${rest}</div>`) +
    acc('spot', T('acc_spot'), T('n_places', { n: (g.spots || []).filter(s => s.cat !== 'airport' && s.cat !== 'station').length }), `<div class="rlist">${spots}</div>`) +
    acc('season', T('acc_season'), '', season) +
    acc('src', T('acc_src'), T('n_docs', { n: (g.sources || []).length }), `<ul class="srcs">${srcs || `<li>${esc(T('none'))}</li>`}</ul>`);
}

/* ───────── 이동(주소창) ───────── */
function go(dest, push){
  st.dest = dest; st.day = 0; st.sel = -1; st.variant = 0;
  const h = dest ? `#${dest}` : '#home';
  if (push !== false){ try { if (!dest && st.pushed === 0) history.replaceState({ dest }, '', h); else { history.pushState({ dest }, '', h); st.pushed++; } } catch(e){ location.hash = h; } }
  render(); window.scrollTo(0, 0);
}
function render(){ closeLang(); if (st.dest && GUIDES[st.dest]) renderDest(); else renderHome(); }
function parseHash(){ const h = (location.hash || '').replace('#', ''); return own(GUIDES, h) ? h : null; }
window.addEventListener('popstate', () => { st.pushed = Math.max(0, st.pushed - 1); st.dest = parseHash(); st.day = 0; st.sel = -1; st.variant = 0; render(); window.scrollTo(0, 0); });
function openLang(){ const m = document.getElementById('langmenu'); m.innerHTML = langMenu(); m.classList.add('on'); document.getElementById('scrim').classList.add('on'); }
function closeLang(){ document.getElementById('langmenu').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('scrim').addEventListener('click', closeLang);

/* ───────── 입력 처리 ───────── */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !app.contains(el)) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'origin'){ st.origin = v; S.set('origin', v); st.mapSel = ''; renderHome(); return; }
  if (act === 'nights'){ st.nights = Number(v); S.set('nights', st.nights); renderHome(); return; }
  if (act === 'tag'){ st.tag = v; renderHome(); return; }
  if (act === 'sort'){ st.sort = v; renderHome(); return; }
  if (act === 'top'){ window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (act === 'lang'){ e.stopPropagation(); const m = document.getElementById('langmenu'); if (m.classList.contains('on')) closeLang(); else openLang(); return; }
  if (act === 'mapdot'){ e.preventDefault(); st.mapSel = st.mapSel === v ? '' : v; st.pinSel = ''; document.getElementById('jpmap').innerHTML = jpMapSvg(); document.getElementById('maptip').innerHTML = mapTip(); return; }
  if (act === 'mappin'){ e.preventDefault(); st.pinSel = st.pinSel === v ? '' : v; st.mapSel = ''; document.getElementById('jpmap').innerHTML = jpMapSvg(); document.getElementById('maptip').innerHTML = mapTip();
    const c = st.pinSel && document.getElementById(`card-${v}`); if (c){ c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600); }
    return; }
  if (act === 'region'){ const from = regionView(st.region); st.region = v; st.pinSel = ''; st.mapSel = ''; renderHome(); animateMap(from, regionView(st.region)); centerChip(); return; }
  if (act === 'sclear'){ e.preventDefault(); st.q = ''; const q = document.getElementById('q'); if (q){ q.value = ''; q.focus(); } updSearch(); return; }
  if (act === 'sq'){ st.q = v; const q = document.getElementById('q'); if (q) q.value = v; updSearch(); return; }
  if (act === 'open'){ e.stopPropagation(); go(v); return; }
  if (act === 'back'){ if (st.pushed > 0) history.back(); else go(null); return; }
  if (act === 'setnights'){ st.nightsSel = Number(v); st.variant = 0; st.day = 0; st.sel = -1; renderDest(); return; }
  if (act === 'variant'){ st.variant = Number(v); st.day = 0; st.sel = -1; renderDest(); return; }
  if (act === 'day'){ st.day = Number(v); st.sel = -1; const g = GUIDES[st.dest]; const plan = curPlan(g); document.getElementById('planarea').innerHTML = planHtml(g, plan); const dh = document.querySelector('.dayhead'); if (dh) dh.scrollIntoView({ behavior: 'smooth', block: 'start' }); mountMap(g, plan); return; }
  if (act === 'focus'){ if (e.target.closest('a,button.opt')) return; focusStop(Number(v), true); return; }
  if (act === 'pick'){ e.stopPropagation(); const at = v.lastIndexOf('|'); const pk = v.slice(0, at), rid = v.slice(at + 1); st.picks[pk] = rid; S.set('picks', st.picks); const g = GUIDES[st.dest]; const plan = curPlan(g); const y = window.scrollY; document.getElementById('planarea').innerHTML = planHtml(g, plan); window.scrollTo(0, y); mountMap(g, plan); return; }
  if (act === 'check'){ st.checks[v] = !st.checks[v]; S.set('checks', st.checks); el.classList.toggle('done', !!st.checks[v]); el.setAttribute('aria-checked', String(!!st.checks[v])); return; }
  if (act === 'budget'){ const d = document.getElementById('acc-budget'); if (d){ d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); } return; }
  if (act === 'share'){ share(); return; }
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'q'){ if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); const f = document.querySelector('#sres .sitem'); if (f){ e.target.blur(); go(f.dataset.v); } } else if (e.key === 'Escape'){ st.q = ''; e.target.value = ''; updSearch(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.dot,.cpin,.checks li')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
app.addEventListener('input', e => { if (e.target.id === 'q'){ st.q = e.target.value; updSearch(); } });
function share(){
  const g = GUIDES[st.dest]; const plan = g && curPlan(g);
  const title = g ? `${g.name} ${plan ? nd(plan.nights) : ''} ${T('plan_word')}` : T('brand');
  const url = location.href;
  const copy = () => { try { navigator.clipboard.writeText(url).then(() => toast(T('copied')), () => toast(url)); } catch(e){ toast(url); } };
  if (navigator.share && /^https?:/.test(url)){ navigator.share({ title, url }).catch(err => { if (!err || err.name !== 'AbortError') copy(); }); } else copy();
}

/* ───────── 시작 ───────── */
silDefs();
st.dest = parseHash();
try { history.replaceState({ dest: st.dest }, '', st.dest ? `#${st.dest}` : location.hash || '#home'); } catch(e){}
render();
})();
</script>
