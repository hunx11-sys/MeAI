<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(Pretendard-Black.woff2);font-weight:900}
*{margin:0;box-sizing:border-box}
body{width:900px;height:1350px;font-family:P;color:#191F28;background:#fff;word-break:keep-all;letter-spacing:-.02em}
.top{position:relative;height:640px;background:linear-gradient(160deg,#C8102E 0%,#A50D26 100%);color:#fff;padding:70px 64px 0;overflow:hidden}
.top:after{content:"";position:absolute;right:-120px;top:-120px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.07)}
.date{display:inline-block;background:#fff;color:#C8102E;font-weight:800;font-size:30px;padding:12px 26px;border-radius:999px}
h1{font-weight:900;font-size:84px;line-height:1.18;margin-top:34px;letter-spacing:-.04em}
.sub{margin-top:30px;font-size:40px;font-weight:700;line-height:1.3}
.sub b{background:#fff;color:#C8102E;padding:2px 14px;border-radius:12px;font-weight:900}
.m{position:absolute;right:34px;bottom:-6px;height:360px}
.path{margin:-46px 64px 0;position:relative;background:#fff;border-radius:28px;box-shadow:0 12px 32px rgba(25,31,40,.14);padding:26px 34px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700}
.path .lb{color:#6B7684;font-size:24px;font-weight:600}
.path .ar{color:#C8102E;font-weight:900}
.path .k{background:#FDECEE;color:#A50D26;padding:8px 18px;border-radius:14px}
.steps{padding:40px 64px 0;display:flex;flex-direction:column;gap:22px}
.s{display:flex;gap:26px;align-items:center;background:#F9FAFB;border:2px solid #E5E8EB;border-radius:28px;padding:28px 32px}
.n{flex:none;width:68px;height:68px;border-radius:50%;background:#C8102E;color:#fff;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center}
.s h3{font-size:34px;font-weight:800;line-height:1.3}
.s h3 em{font-style:normal;color:#C8102E}
.s p{font-size:26px;color:#4E5968;font-weight:500;margin-top:6px;line-height:1.4}
.foot{position:absolute;left:0;right:0;bottom:0;height:92px;background:#191F28;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;gap:12px}
.foot span{color:#FF8A9B}
</style></head><body>
<div class="top">
 <span class="date">11월 1일 영업 시작!</span>
 <h1>오늘,<br>누구한테<br>영업하지?</h1>
 <div class="sub"><b>MeAI</b>가 추천해드립니다!</div>
 <img class="m" src="m.webp">
</div>
<div class="path"><span class="lb">들어가는 길</span> 영업포탈 <span class="ar">›</span> <span class="k">MeAI홈</span></div>
<div class="steps">
 <div class="s"><div class="n">1</div><div><h3>내 고객 <em>영업전략 한 줄</em></h3><p>MeAI홈에 들어가면 고객별 전략이 바로 보여요</p></div></div>
 <div class="s"><div class="n">2</div><div><h3><em>맞춤대화</em> 누르면 한번에</h3><p>보장분석부터 영업전략까지 자동으로</p></div></div>
 <div class="s"><div class="n">3</div><div><h3><em>요약리포트</em>로 AI분석 출력</h3><p>내 고객에 대한 AI 분석을 뽑아 가세요</p></div></div>
</div>
<div class="foot">지금 바로 <span>영업포탈 › MeAI홈</span> 에서 확인하세요</div>
</body></html>
