<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeAI 영업 플라이휠</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF; --paper-2: #F2F4F6; --ink: #191F28; --muted: #4E5968; --soft: #6B7684;
      --accent: #C8102E; --accent-tint: rgba(200,16,46,0.08); --rule: rgba(25,31,40,0.12);
      --sans: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --mono: 'Geist Mono', 'D2Coding', 'Consolas', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; background: var(--paper); color: var(--ink); font-family: var(--sans); word-break: keep-all; }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.8125rem var(--sans); }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 700 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.3 var(--sans); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 752px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 15px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 500 12px var(--sans); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 700 17px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.8; font: 500 12px var(--sans); text-anchor: middle; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">고리 도식 · 영업 플라이휠</p>
    <h1>MeAI 영업 플라이휠</h1>
    <div class="scroll">
    <svg viewBox="144 4 752 628" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meai-flywheel-title meai-flywheel-desc">
      <title id="meai-flywheel-title">MeAI 영업 플라이휠</title>
      <desc id="meai-flywheel-desc">고객발굴, 터치, 클로징, 계약체결, 관리·소개 다섯 단계가 시계 방향으로 돌아 다시 고객발굴로 이어지고, 단계마다 쌓인 내용이 가운데 고객 관계 기록에 모이며 계약체결이 강조되어 있다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4E5968"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7684"/></marker>
      </defs>
      <rect x="144" y="4" width="752" height="628" fill="#FFFFFF"/>

      <path class="ring" d="M604.000 115.180 A240 240 0 0 1 733.784 230.930" marker-end="url(#arrow)"/>
      <path class="ring" d="M755.932 296.000 A240 240 0 0 1 696.043 503.122" marker-end="url(#arrow)"/>
      <path class="ring" d="M594.940 568.000 A240 240 0 0 1 446.201 568.372" marker-end="url(#arrow)"/>
      <path class="ring" d="M344.774 504.000 A240 240 0 0 1 283.851 297.180" marker-end="url(#arrow)"/>
      <path class="ring" d="M305.673 232.000 A240 240 0 0 1 434.877 115.603" marker-end="url(#arrow)"/>

      <path class="spoke" d="M520.0 132.0 L520.0 282.0" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M664.0 292.0 L625.7 304.8" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M637.1 504.0 L560.6 396.9" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M402.9 504.0 L479.4 396.9" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M376.0 292.0 L414.3 304.8" marker-end="url(#arrow-soft)"/>

      <rect class="station" x="436" y="68" width="168" height="64" rx="6"/>
      <text x="520" y="95" class="node-name">고객발굴</text><text x="520" y="115" class="sublabel">DB 분석 · 운세 넛지</text>

      <rect class="station" x="664" y="232" width="168" height="64" rx="6"/>
      <text x="748" y="259" class="node-name">터치</text><text x="748" y="279" class="sublabel">화법 · 프롬프트</text>

      <rect class="station" x="576" y="504" width="168" height="64" rx="6"/>
      <text x="660" y="531" class="node-name">클로징</text><text x="660" y="551" class="sublabel">보상시뮬레이터</text>

      <rect class="station focal" x="296" y="504" width="168" height="64" rx="6"/>
      <text x="380" y="531" class="node-name focal-name">계약체결</text><text x="380" y="551" class="sublabel">특약검색 · 상품 히스토리</text>

      <rect class="station" x="208" y="232" width="168" height="64" rx="6"/>
      <text x="292" y="259" class="node-name">관리·소개</text><text x="292" y="279" class="sublabel">보상 안내 · 소개 요청</text>

      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">고객 관계 기록</text>
      <text x="520" y="360" class="hub-sub">단계마다 쌓이는 고객 정보</text>
    </svg>
    </div>
  </main>
</body>
</html>
