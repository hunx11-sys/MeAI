# 오늘의 운세 v2 · nginx 예시 (server { } 안에 넣는다)
# mime.types 에 아래 두 줄이 없으면 추가한다 (최근 nginx 는 이미 들어 있다)
#     image/webp  webp;
#     font/woff2  woff2;
location /unse/ {
    root /srv/www;                  # /srv/www/unse/ 에 unse 폴더를 올린 경우
    index index.html;
    charset utf-8;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;   # 파일이 작아 폴더 전체를 no-cache 로 둬도 부담이 없다
}
