<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>통합치료비 시뮬레이터 | 메리츠화재</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 토스페이스(Tossface) 이모지 서체 · Copyright (c) Viva Republica · https://toss.im/tossface/copyright -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface/dist/tossface.css">
<style>
:root{
  --blue:#3182F6; --blue-d:#1B64DA; --blue-50:#E8F3FF; --blue-100:#C9E2FF;
  --red:#F04452; --red-50:#FFEEEF; --pink-50:#FFF0F6; --orange:#FE9800; --orange-50:#FFF3E0;
  --yellow-50:#FFF8DB; --green:#03B26C; --green-50:#E5F8EF; --purple:#8B5CF6; --purple-50:#F3F0FF;
  --g900:#191F28; --g800:#333D4B; --g700:#4E5968; --g600:#6B7684; --g500:#8B95A1; --g400:#B0B8C1;
  --g300:#D1D6DB; --g200:#E5E8EB; --g100:#F2F4F6; --g50:#F9FAFB; --w:#fff;
  --meritz:#C8102E;
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--g100);color:var(--g900);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
button,a,input{touch-action:manipulation}
button{font-family:inherit;letter-spacing:inherit;cursor:pointer;color:inherit;-webkit-appearance:none;appearance:none;border-radius:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--blue-100);outline-offset:2px;border-radius:10px}

/* ── 토스페이스 아이콘 ── */
.ic{font-family:Tossface,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;font-weight:400;line-height:1;display:inline-block;letter-spacing:0}
.tl{position:relative;display:inline-grid;place-items:center;flex:none;background:var(--g100)}
.tl-20{width:20px;height:20px;border-radius:7px;font-size:12px}
.tl-24{width:24px;height:24px;border-radius:8px;font-size:14px}
.tl-28{width:28px;height:28px;border-radius:9px;font-size:16px}
.tl-32{width:32px;height:32px;border-radius:10px;font-size:18px}
.tl-36{width:36px;height:36px;border-radius:12px;font-size:20px}
.tl-40{width:40px;height:40px;border-radius:13px;font-size:22px}
.tl-44{width:44px;height:44px;border-radius:14px;font-size:24px}
.tl-56{width:56px;height:56px;border-radius:18px;font-size:30px}
.tl-64{width:64px;height:64px;border-radius:20px;font-size:34px}
.tl .hb{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;box-shadow:0 1px 3px rgba(0,27,55,.14)}
.tl .cd{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.bg-ca{background:var(--red-50)} .bg-sim{background:var(--pink-50)} .bg-pr{background:var(--green-50)} .bg-cv{background:var(--blue-50)}
.bg-y{background:var(--yellow-50)} .bg-p{background:var(--purple-50)} .bg-o{background:var(--orange-50)} .bg-w{background:#fff}

/* ── 앱바 ── */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--g200)}
.appbar-in{max-width:1180px;margin:0 auto;height:58px;padding:0 20px;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:10px;background:var(--meritz);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-0.02em}
.appbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px}
.appbar .sub{font-size:12px;color:var(--g500);font-weight:500;display:inline-flex;align-items:center;gap:3px}
.appbar .sub .ic{font-size:13px}
.appbar .sp{flex:1}
@media(max-width:520px){.appbar .sub{display:none}}
.ver{font-size:12px;font-weight:600;color:var(--g600);background:var(--g100);padding:5px 10px;border-radius:999px}
.home{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--g700);background:var(--g100);padding:6px 11px;border-radius:999px;text-decoration:none;transition:background .15s,color .15s;white-space:nowrap}
.home:hover{background:var(--blue-50);color:var(--blue-d)}
.home .ic{font-size:13px}

/* ── 레이아웃 ── */
.layout{max-width:1180px;margin:0 auto;padding:20px 20px 88px;display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(max-width:960px){.layout{grid-template-columns:1fr;padding:12px 12px 88px}}

.card{background:var(--w);border-radius:24px;padding:24px}
@media(max-width:520px){.card{padding:20px;border-radius:22px}}
.ttl{font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;margin:0}
.ttl-s{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1.4}
.desc{color:var(--g600);font-size:14px;margin:6px 0 0}
.cap{color:var(--g500);font-size:13px}
.sh{display:flex;align-items:center;gap:10px}
.sh .ttl-s{flex:1;min-width:0}
.sh+.desc{margin-top:8px}

/* ── 검색 카드 ── */
.hero-ic{position:relative;width:64px;height:64px;margin:2px 0 16px}
.hero-ic .tl-64{background:var(--blue-50)}
.hero-ic .mini{position:absolute;width:28px;height:28px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px rgba(0,27,55,.12)}
.hero-ic .m1{right:-14px;top:-6px;transform:rotate(10deg)}
.hero-ic .m2{right:-20px;bottom:0;transform:rotate(-8deg)}
.search{position:relative;margin-top:18px}
.search input{width:100%;height:56px;font-size:16px;border:0;border-radius:16px;background:var(--g100);padding:0 48px 0 50px;font-size:16px;font-family:inherit;color:var(--g900);outline:none;transition:box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--g400)}
.search input:focus{background:#fff;box-shadow:0 0 0 2px var(--blue) inset}
.search .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--g300);color:#fff;font-size:13px;font-weight:700;display:none;place-items:center;padding:0}
.search .clr.on{display:grid}
.sug{position:absolute;left:0;right:0;top:62px;-webkit-overflow-scrolling:touch;background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(0,27,55,.14),0 2px 6px rgba(0,27,55,.06);padding:6px;display:none;z-index:40;max-height:440px;overflow:auto}
.sug.on{display:block}
.sug button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 10px;border-radius:14px;text-align:left}
.sug button.act,.sug button:hover{background:var(--g100)}
.sug .nm{flex:1;min-width:0}
.sug .nm b{display:block;font-size:15px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .nm span{display:block;font-size:12px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .nm span em{font-style:normal;font-weight:700;color:var(--g700)}
.sug mark{background:none;color:var(--blue);font-weight:700}
.sug .empty{padding:18px 12px;color:var(--g500);font-size:14px;display:flex;gap:10px;align-items:center}

/* ── 태그 ── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:7px;padding:3px 7px;white-space:nowrap;line-height:1.35}
.tag .ic{font-size:12px}
.t-ca{background:var(--red-50);color:#D22030}
.t-sim{background:var(--pink-50);color:#C2255C}
.t-pr{background:var(--green-50);color:#0A8754}
.t-cv{background:var(--blue-50);color:var(--blue-d)}
.t-g{background:var(--g100);color:var(--g700)}
.t-nc{background:var(--purple-50);color:#6741D9}
.t-j{background:var(--g800);color:#fff}

/* ── 추천 칩 ── */
.chipgrp{margin-top:22px}
.chipgrp h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--g800);display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--g100);color:var(--g800);font-size:14px;font-weight:600;padding:8px 13px 8px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:background .12s,transform .12s var(--ease)}
.chip .ic{font-size:16px}
.chip:hover{background:var(--g200)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--g900);color:#fff}

/* ── 조합 카드 ── */
.tbtn{border:0;background:none;color:var(--blue);font-size:15px;font-weight:600;padding:6px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tbtn:hover{background:var(--blue-50)}
.tbtn .ic{font-size:14px}
.cgl{font-size:13px;font-weight:700;color:var(--g600);margin:18px 0 4px;display:flex;align-items:center;gap:6px}
.cgl .ic{font-size:14px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0}
.crow .n{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4}
.crow .n small{display:block;font-size:12px;color:var(--g500);font-weight:500}
.crow .v{font-weight:700;font-size:15px}
.crow-empty{display:flex;align-items:center;gap:10px;padding:10px 0;color:var(--g500);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* ── 빈 상태 ── */
.empty-card{text-align:center;padding:44px 24px 36px}
.orbit{position:relative;width:176px;height:148px;margin:0 auto 18px}
.orbit .core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:28px;background:var(--blue-50);display:grid;place-items:center;font-size:46px}
.orbit .o{position:absolute;width:40px;height:40px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(0,27,55,.10);animation:bob 3.2s var(--ease) infinite alternate}
.orbit .o1{left:4px;top:10px;animation-delay:-.4s} .orbit .o2{right:6px;top:2px;animation-delay:-1.2s}
.orbit .o3{left:0;bottom:6px;animation-delay:-2s} .orbit .o4{right:0;bottom:14px;animation-delay:-.8s}
.orbit .o5{left:50%;top:-12px;margin-left:-20px;width:34px;height:34px;font-size:18px;border-radius:12px;animation-delay:-1.6s}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-7px) rotate(4deg)}}
.how{list-style:none;margin:24px auto 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px}
.how li{background:var(--g50);border-radius:16px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--g700);line-height:1.4}
.how li .n{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-50);border-radius:999px;padding:1px 7px}
.how li .tl{background:#fff}
.empty-card .qs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}
.qs-l{font-size:13px;color:var(--g500);margin-top:22px;font-weight:500}
.qs-l+.qs{margin-top:10px}

/* ── 질병 헤더 ── */
.dz-h{display:flex;gap:16px;align-items:flex-start}
.dz-h h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.03em;line-height:1.3}
.dz-h .kc{font-size:13px;color:var(--g500);margin-top:2px}
.dz-h .kc b{color:var(--g700);font-weight:700}
.dz-h .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dz-d{margin:16px 0 0;color:var(--g700);font-size:15px;background:var(--g50);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.dz-d .ic{font-size:18px;margin-top:1px}

.cov{margin-top:18px}
.cov h4{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--g800);display:flex;align-items:center;gap:6px}
.cov h4 .ic{font-size:16px}
.cov-l{display:flex;flex-wrap:wrap;gap:6px}
.cv-c{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--g200);border-radius:999px;padding:4px 12px 4px 4px;color:var(--g800)}
.cv-c .tl{border-radius:50%}
.cv-c b{font-weight:700;color:var(--blue-d)}
.cv-c.no{color:var(--g400);background:transparent;border-style:dashed}
.cv-c.no .tl{filter:grayscale(1);opacity:.5}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--g600);font-weight:500}
.addrow>.lb{display:inline-flex;align-items:center;gap:5px;margin-right:2px}
.addbtn{border:0;background:var(--blue-50);color:var(--blue-d);font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px 5px 6px;display:inline-flex;align-items:center;gap:6px;transition:background .12s,transform .12s var(--ease)}
.addbtn .ic{font-size:14px;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center}
.addbtn:hover{background:var(--blue-100)}
.addbtn:active{transform:scale(.95)}
.rel{margin-top:14px;padding-top:14px;border-top:1px solid var(--g100);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--g600);font-weight:500}
.rel .lb{display:inline-flex;align-items:center;gap:5px;margin-right:2px}
.rel button{border:0;background:var(--g100);color:var(--g800);font-weight:600;font-size:13px;padding:5px 11px 5px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.rel button .ic{font-size:14px}
.rel button:hover{background:var(--g200)}

/* ── 치료 과정 선택 ── */
.paths{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 4px;scrollbar-width:none;margin-top:16px}
.paths::-webkit-scrollbar{display:none}
.pth{flex:none;width:168px;border:1.5px solid var(--g200);background:#fff;border-radius:18px;padding:14px;text-align:left;color:var(--g800);transition:border-color .15s,background .15s,transform .12s var(--ease);display:flex;flex-direction:column;gap:10px}
.pth b{display:block;font-size:14px;font-weight:700;line-height:1.4;letter-spacing:-0.02em}
.pth span.f{display:inline-flex;font-size:12px;color:var(--g500);font-weight:600;margin-top:4px}
.pth:hover{border-color:var(--g300)}
.pth:active{transform:scale(.97)}
.pth.on{border-color:var(--blue);background:var(--blue-50)}
.pth.on span.f{color:var(--blue-d)}
.pth .tl{background:var(--g100)}
.pth.on .tl{background:#fff}

/* ── 합계 ── */
.total{position:relative;overflow:hidden}
.tot-h{display:flex;align-items:center;gap:14px}
.tot-h .tl{background:var(--yellow-50)}
.tot-h .tl.pop{animation:pop .32s var(--ease-out)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14) rotate(-6deg)}100%{transform:scale(1)}}
.total .lead{font-size:15px;color:var(--g600);font-weight:600}
.total .amt{font-size:40px;font-weight:800;letter-spacing:-0.04em;line-height:1.15;margin:16px 0 4px;color:var(--g900)}
.total .amt .rcv{font-size:22px;font-weight:700;color:var(--g700);margin-left:6px;letter-spacing:-0.02em}
@media(max-width:520px){.total .amt{font-size:34px}.total .amt .rcv{font-size:19px}}
.total .basis{font-size:13px;color:var(--g500);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.total .basis .ic{font-size:13px}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--g100);margin:20px 0 12px;gap:3px}
.split i{display:block;height:100%;border-radius:999px;transition:width .4s var(--ease)}
.leg .row{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.leg .row .n{flex:1;min-width:0;color:var(--g800);font-weight:600;line-height:1.4}
.leg .row .n small{display:block;color:var(--g500);font-size:12px;font-weight:500}
.leg .row b{font-weight:700}
.leg .row.zero .n,.leg .row.zero b{color:var(--g400)}
.leg .row.zero .tl{filter:grayscale(1);opacity:.55}
.capn{font-size:11px;color:#C26A00;background:var(--orange-50);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700;vertical-align:1px}

.tog{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;background:var(--g50);border-radius:18px}
.tog .tl{background:#fff}
.tog .t{flex:1;min-width:0}
.tog .t b{display:block;font-size:15px;font-weight:700}
.tog .t span{display:block;font-size:13px;color:var(--g500);margin-top:2px}
.sw{position:relative;width:52px;height:32px;border:0;border-radius:999px;background:var(--g300);flex:none;transition:background .2s var(--ease);padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .2s var(--ease)}
.sw[aria-checked="true"]{background:var(--blue)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* ── 치료 여정 ── */
.steps{margin-top:20px}
.st{position:relative;display:grid;grid-template-columns:40px 1fr;gap:14px;padding-bottom:22px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:19px;top:46px;bottom:4px;width:2px;border-radius:2px;background:var(--g200)}
.st:last-child::before{display:none}
.st .node{position:relative;align-self:start;width:40px;height:40px}
.st .node .no{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:18px;border-radius:999px;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.st .bd{min-width:0}
.st .hd{display:flex;align-items:flex-start;gap:10px}
.st .hd .tt{flex:1;min-width:0}
.st .stg{font-size:12px;font-weight:700}
.st h5{margin:1px 0 0;font-size:16px;font-weight:700;letter-spacing:-0.02em;line-height:1.4}
.st .ex{font-size:13px;color:var(--g600);margin-top:2px}
.st .sum{font-size:17px;font-weight:700;white-space:nowrap;color:var(--blue)}
.st .sum.z{color:var(--g400);font-weight:600}
.kch{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.kchip{border:0;background:var(--g100);color:var(--g700);font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px 4px 6px;display:inline-flex;align-items:center;gap:4px;transition:background .12s,transform .12s var(--ease)}
.kchip .ic{font-size:14px}
.kchip:hover{background:var(--g200)}
.kchip:active{transform:scale(.95)}
.kchip .q{width:14px;height:14px;border-radius:50%;background:var(--g300);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;margin-left:1px}
.st .bdg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.lines{margin-top:10px;background:var(--g50);border-radius:16px;padding:4px 14px}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
.ln+.ln{border-top:1px solid var(--g100)}
.ln .rn{flex:1;min-width:0;line-height:1.4}
.ln .rn b{font-weight:700;color:var(--g800)}
.ln .rn span{display:block;font-size:12px;color:var(--g500)}

  const P=[];
  if(inList(C32,code)!=='no') P.push({t:'대표 치료 · 수술(시술) + 중환자실',f:'대표 예시',e:[['진단','CT + MRI','병변을 확인해요',['x_ct','x_mri']],['시술','수술·경피적 시술','카테터 시술도 수술로 인정돼요',['surg']],['중환자','종합병원 중환자실 치료','집중 치료예요',['icu']],['재활','재활치료 10회','기능 회복 재활이에요',['rehab'],{n:10}]]});
  if(inList(M61,code)!=='no') P.push({t:'대표 치료 · 3종 수술 예시',f:'대표 예시',e:[['진단','CT','병변을 확인해요',['x_ct']],['수술','혈관·경피적 수술(3종 예시)','수술 종류에 따라 1~5종이 달라져요',['surg'],{j:3}],['재활','재활치료 10회','기능 회복 재활이에요',['rehab'],{n:10}]]});
  if(inList(P60,code)!=='no') P.push({t:'대표 치료 · 검사 + 2종 수술 예시',f:'대표 예시',e:[['진단','CT + 특정내시경','병변을 확인해요',['x_ct','x_endo']],['수술','내시경·복강경 수술(2종 예시)','수술 종류에 따라 1~5종이 달라져요',['surg'],{j:2}]]});

function getDz(code){
  let d=DZ.find(x=>x.c===code);
  if(!d && code.length===3) d=null;
  const kn=KCD.get(code)||KCD.get(code.slice(0,3))||'';
  if(d) return {code, name:d.n, kname:kn, desc:d.d, rel:d.rel||[], P:d.P, Y5:d.Y5, curated:true};
  return {code, name:kn||code, kname:kn, desc:'대표 치료 예시로 계산했어요. 실제 치료 방법에 따라 받는 금액은 달라져요.', rel:[], P:genericPaths(code), curated:false};
}

/* ── 계산 엔진 (원본 그대로) ── */
function calcRider(id,tier,dz,path,y1){
  const r=RM[id], items=IT[r.ty], A=AMT[r.ty][tier];
  const res={id,tier,cov:cover(r,dz.code),lines:[],raw:0,total:0,cap:0,capped:false};
  if(res.cov==='no') return res;
  const dc=cancerCls(dz.code), sp=isSp(dz.code), inj=r.ty==='MS'&&isInjury(dz.code);
  const f=(r.half&&y1&&!inj)?0.5:1;
  const used={}; let rehab=0;
  path.e.forEach((ev,ei)=>{
    const o=ev[4]||{};
    evKeys(ev).forEach(k=>{
      const cands=items.map((it,i)=>({it,i})).filter(x=>x.it.k===k);
      if(!cands.length){ res.lines.push({ei,k,amt:0,why:'none'}); return; }
      const el=cands.filter(({it})=>(!it.cl||it.cl.includes(dc))&&(it.sp===undefined||it.sp===sp)&&(!it.j||it.j===o.j));
      if(!el.length){ res.lines.push({ei,k,amt:0,why:'cls',i:cands[0].i}); return; }
      const {it,i}=el[0];
      if(it.nc&&!o.nc){ res.lines.push({ei,k,i,amt:0,why:'nc'}); return; }
      const base=A[i]*f;
      if(it.p==='y'){
        if(used[i]) res.lines.push({ei,k,i,amt:0,why:'once'});
        else{ used[i]=1; res.lines.push({ei,k,i,amt:base}); }
      }else if(it.p==='o'){ res.lines.push({ei,k,i,amt:base}); }
      else{
        const req=o.n||1, n=Math.max(0,Math.min(req,it.max-rehab)); rehab+=n;
        res.lines.push({ei,k,i,amt:base*n,n,req,max:it.max,why:n<req?'max':''});
      }
    });
  });
  res.raw=res.lines.reduce((s,l)=>s+l.amt,0);
  res.cap=tier*((r.half&&y1)?0.5:1);
  res.total=Math.min(res.raw,res.cap); res.capped=res.raw>res.cap;
  return res;
}
function activeIds(){ return RIDERS.map(r=>r.id).filter(id=>S.combo[id]); }
function groupsFor(code){ const g=new Set(); RIDERS.forEach(r=>{ if(cover(r,code)!=='no') g.add(r.g); }); return g; }
function shownIds(code){ const g=groupsFor(code); return activeIds().filter(id=>g.has(RM[id].g)); }
function calcAll(dz,path,y1){ return shownIds(dz.code).map(id=>calcRider(id,S.combo[id],dz,path,y1)); }

function whyText(l,dz){
  const dc=cancerCls(dz.code);
  if(l.why==='nc') return '급여 치료라 비급여 전용 항목은 해당하지 않아요';
  if(l.why==='once') return '같은 해에 이미 받은 항목이에요(연 1회)';
  if(l.why==='max') return `연간 ${l.max}회 한도라 ${l.n}회만 인정돼요`;
  if(l.why==='none') return '이 특약에는 해당 항목이 없어요';
  if(l.why==='cls'){
    if(dc==='cis'||dc==='bord') return '제자리암·경계성종양은 이 항목 대상이 아니에요';
    if((dc==='skin'||dc==='thy')&&l.k==='pain') return '유사암은 통증완화 항목 대상이 아니에요';
    return '이 질병은 해당 항목 대상이 아니에요';
  }
  return '';
}

/* ── 검색 ── */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=s=>[...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00; return c>=0&&c<=11171?CHO[Math.floor(c/588)]:ch;}).join('');
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'');
const isCho=s=>s.length>0&&[...s].every(c=>CHO.includes(c));
const IDX=[];
DZ.forEach(d=>IDX.push({code:d.c,name:d.n,sub:(KCD.get(d.c)||KCD.get(d.c.slice(0,3))||''),keys:[d.n,...d.a].map(norm),pri:0}));
Object.entries(SYN).forEach(([k,v])=>{ const code=v.find(c=>DZ.some(d=>d.c===c))||v[0]; IDX.push({code,name:k,sub:v.join(', '),keys:[norm(k)],pri:1}); });
KCD.forEach((nm,code)=>IDX.push({code,name:nm,sub:'',keys:[norm(nm)],pri:2,kcd:true}));
IDX.forEach(x=>x.cho=x.keys.map(cho));
function suggest(q){
  const n=norm(q); if(!n) return [];
  const codeLike=/^[a-z]\d/i.test(n), out=[], seen=new Set();
  const push=x=>{ const key=x.code+'|'+x.name; if(seen.has(key)) return; if((codeLike||x.kcd)&&seen.has(x.code)) return; seen.add(key); seen.add(x.code); out.push(x); };
  if(codeLike){
    const u=n.toUpperCase();
    IDX.filter(x=>x.pri!==1&&x.code.toUpperCase().startsWith(u)).sort((a,b)=>a.pri-b.pri||a.code.length-b.code.length||a.code.localeCompare(b.code)).forEach(push);
  }else{
    const ch=isCho(n);
    const hit=x=>ch?x.cho.some(c=>c.includes(n)):x.keys.some(k=>k.includes(n));
    const starts=x=>x.keys.some(k=>k.startsWith(n));
    IDX.filter(hit).sort((a,b)=>a.pri-b.pri||(starts(b)-starts(a))||a.name.length-b.name.length).forEach(push);
  }
  return out.slice(0,8);
}
function hl(txt,q){
  const n=q.trim(); if(!n||isCho(norm(n))) return esc(txt);
  const i=txt.toLowerCase().indexOf(n.toLowerCase()); if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+n.length))+'</mark>'+esc(txt.slice(i+n.length));
}
const tagHtml=t=>`<span class="tag ${t[0]}">${TAGIC[t[0]]?ic(TAGIC[t[0]]):''}${esc(t[1])}</span>`;

  box.innerHTML=sugItems.map((x,i)=>{

function countUp(el,from,to){
  if(!el) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||from===to){ el.textContent=won(to); return; }
  const t0=performance.now(), d=520;
  const step=t=>{ const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3); el.textContent=won(Math.round(from+(to-from)*e)); if(p<1) requestAnimationFrame(step); else el.textContent=won(to); };
  requestAnimationFrame(step);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) { if(!e.target.closest('.search')) $('#sug').classList.remove('on'); return; }
  if(t.dataset.gl){ toast(t.dataset.gl); return; }
  if(t.dataset.code){ pickCode(t.dataset.code); return; }
  if(t.closest('#sug')&&t.dataset.i!==undefined){ /* 포인터이벤트 미지원 기기 대비 */ if(Date.now()-sugPickedAt>600) pickCode(sugItems[+t.dataset.i].code); return; }
  if(t.dataset.p!==undefined){ S.path=(t.dataset.p==='mine')?'mine':+t.dataset.p; renderMain(false); return; }
  if(t.id==='mkMine'){ openBuilder(); return; }
  if(t.id==='y5det'){ S.y5=!S.y5; renderMain(false); return; }
  if(t.dataset.badd!==undefined){ const [gi,ii]=t.dataset.badd.split(':').map(Number); addMine(gi,ii); return; }
  if(t.dataset.bdel!==undefined){ draftMine.splice(+t.dataset.bdel,1); drawBuilder(); return; }
  if(t.id==='bClear'){ draftMine=[]; drawBuilder(); return; }
  if(t.id==='bApply'){ applyMine(); return; }
  if(t.id==='y1'){ S.y1=!S.y1; renderMain(false); return; }
  if(t.dataset.tier){ const [id,v]=t.dataset.tier.split(':'); S.combo[id]=+v; store.set('itc_combo',S.combo); renderCombo(); renderMain(false); return; }
  if(t.dataset.add){ const r=RM[t.dataset.add]; S.combo[r.id]=r.tiers[Math.floor((r.tiers.length-1)/2)]; store.set('itc_combo',S.combo); renderCombo(); renderMain(false); return; }
  if(t.dataset.open==='combo'){ openCombo(); return; }
  if(t.dataset.mx){ openMatrix(t.dataset.mx); return; }
  if(t.dataset.tab){ draftTab=t.dataset.tab; drawCombo(); return; }
  if(t.dataset.tg){ const r=RM[t.dataset.tg]; if(draft[r.id]) delete draft[r.id]; else draft[r.id]=r.tiers[r.tiers.length-1]; drawCombo(); return; }
  if(t.dataset.dt){ const [id,v]=t.dataset.dt.split(':'); draft[id]=+v; drawCombo(); return; }
  if(t.id==='cbReset'){ draft={...DEFAULT_COMBO}; drawCombo(); return; }
  if(t.id==='cbApply'){ S.combo={...draft}; store.set('itc_combo',S.combo); closeSheet(); renderCombo(); renderMain(false); return; }
  if(t.id==='shX'){ closeSheet(); return; }
  if(t.id==='clr'){ $('#q').value=''; renderSug(); $('#q').focus(); return; }
});
$('#dim').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); $('#sug').classList.remove('on'); } });
['input','compositionupdate','compositionend','keyup','search','paste','cut'].forEach(ev=>$('#q').addEventListener(ev,()=>setTimeout(renderSug,0)));
$('#q').addEventListener('focus',()=>setTimeout(renderSug,0));
$('#q').addEventListener('blur',()=>setTimeout(()=>{ if(!document.activeElement||!document.activeElement.closest('.search')) $('#sug').classList.remove('on'); },180));
$('#q').addEventListener('keydown',e=>{
  const box=$('#sug'); if(!box.classList.contains('on')||!sugItems.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sugAct=(sugAct+(e.key==='ArrowDown'?1:-1)+sugItems.length)%sugItems.length; box.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act',i===sugAct)); }
  if(e.key==='Enter'&&sugAct>=0){ e.preventDefault(); pickCode(sugItems[sugAct].code); }
});

/* ── 뇌·심장(특정순환계류) 치료 과정은 받는 금액이 큰 순서로 먼저 보여줘요 (기본 조합 기준, 같으면 원래 순서) ── */
DZ.forEach(d=>{
  if(cancerCls(d.c)||!groupsFor(d.c).has('cv')||d.P.length<2) return;
  const dz0={code:d.c}, ids=RIDERS.filter(r=>r.g==='cv'&&DEFAULT_COMBO[r.id]).map(r=>r.id);
  const tot=p=>ids.reduce((s,id)=>s+calcRider(id,DEFAULT_COMBO[id],dz0,p,false).total,0);
  d.P=d.P.map((p,i)=>({p,i,t:tot(p)})).sort((x,y)=>y.t-x.t||x.i-y.i).map(x=>x.p);
});
/* ── 시작 ── */
renderChips(); renderCombo();
const h=decodeURIComponent((location.hash||'').slice(1));
if(h&&(KCD.has(h)||DZ.some(d=>d.c===h))){ S.dz=getDz(h); renderMain(true); } else renderEmpty();
window.addEventListener('hashchange',()=>{const c=decodeURIComponent(location.hash.slice(1)); if(c&&(!S.dz||S.dz.code!==c)&&(KCD.has(c)||DZ.some(d=>d.c===c))) pickCode(c);});
window.__ITC={S,calcRider,getDz,cover,cancerCls,RIDERS,DZ};
})();
</script>
