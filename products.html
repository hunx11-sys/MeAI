<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>상품 라인업 ver2609 · 메리츠 세일즈혁신</title>
<style>
  :root{
    --blue:#D97706; --blue2:#F59E0B; --blue3:#FBBF24; --blueDeep:#92400E;
    --blueSoft:#FFFBEB; --blueLine:#FDE68A;
    --meritz:#990011;
    --ink:#1B2333; --sub:#5A6273; --mute:#8A93A5;
    --line:#E7E9EF; --bg:#F7F9FC; --card:#fff;
    --warn:#B45309; --warnBg:#FFF7E6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
       color:var(--ink); background:var(--bg); font-size:14px; line-height:1.6;
       -webkit-text-size-adjust:100%}

  /* ── 헤더 ── */
  .hd{position:relative; overflow:hidden; color:#fff;
      background:linear-gradient(135deg,var(--blueDeep) 0%,var(--blue) 55%,var(--blue3) 100%)}
  .hd::after{content:""; position:absolute; right:-60px; top:-70px; width:230px; height:230px;
      border-radius:50%; background:rgba(255,255,255,.07)}
  .hd-in{max-width:1080px; margin:0 auto; padding:20px 18px 22px; display:flex; align-items:center; gap:14px; position:relative; z-index:2}

        filter:drop-shadow(0 6px 12px rgba(0,0,0,.28)); animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-7px) rotate(3deg)}}
  .hd h1{margin:0; font-size:22px; font-weight:900; letter-spacing:-.03em}
  .hd h1 .ver{display:inline-block; font-size:11px; font-weight:800; letter-spacing:0;
        background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.38);
        padding:2px 8px; border-radius:999px; vertical-align:3px; margin-left:4px}
  .hd h1 small{display:block; font-size:11.5px; font-weight:800; opacity:.85; margin-top:3px; letter-spacing:0}
  .hd p{margin:5px 0 0; font-size:12.5px; opacity:.9; font-weight:600}
  .home{position:absolute; right:16px; top:16px; z-index:3; color:#fff; text-decoration:none;
        font-size:11.5px; font-weight:800; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
        padding:6px 12px; border-radius:999px; backdrop-filter:blur(4px)}
  .home:active{background:rgba(255,255,255,.32)}

  .wrap{max-width:1080px; margin:0 auto; padding:0 14px 70px}

  /* ── 탭 ── */
  .tabs{display:flex; gap:6px; margin:14px 0 10px}
  .tab{flex:1; text-align:center; padding:11px 8px; border-radius:12px; border:1px solid var(--line);
       background:#fff; font-weight:800; font-size:13.5px; color:var(--sub); cursor:pointer; transition:.15s}
  .tab.on{background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(217,119,6,.28)}

  /* ── 검색/필터 ── */
  .ctrl{background:var(--bg); padding:8px 0 10px;
        border-bottom:1px solid var(--line); margin-bottom:14px}
  .sbox{position:relative}
  .sbox input{width:100%; padding:13px 40px 13px 40px; border:1.5px solid var(--blueLine); border-radius:13px;
       font-size:15px; font-family:inherit; background:#fff; outline:none; transition:.15s}
  .sbox input:focus{border-color:var(--blue); box-shadow:0 0 0 4px rgba(245,158,11,.12)}
  .sbox .ic{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.5}
  .sbox .cl{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:#EDF0F5;
       width:26px; height:26px; border-radius:50%; cursor:pointer; color:var(--sub); font-size:14px; display:none}
  .sbox .cl.on{display:block}

  .fgrp{margin-top:9px}
  .flab{font-size:10.5px; font-weight:900; color:var(--mute); letter-spacing:.02em; margin:0 0 5px 2px}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{border:1px solid var(--line); background:#fff; color:var(--sub); font-family:inherit;
        font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer;
        white-space:nowrap; transition:.13s}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 3px 10px rgba(217,119,6,.25)}
  .chip.on.g2{background:#0E7490; border-color:#0E7490; box-shadow:0 3px 10px rgba(14,116,144,.25)}
  .chip.on.g3{background:#6D28D9; border-color:#6D28D9; box-shadow:0 3px 10px rgba(109,40,217,.22)}
  .chip.on.g4{background:var(--meritz); border-color:var(--meritz); box-shadow:0 3px 10px rgba(153,0,17,.22)}
  .more{border:0; background:none; color:var(--blue); font-weight:800; font-size:12.5px; cursor:pointer;
        padding:8px 2px 2px; font-family:inherit}
  .adv{display:none} .adv.on{display:block}
  .bar2{display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px}
  .cnt{font-size:12.5px; font-weight:800; color:var(--sub)}
  .cnt b{color:var(--blue); font-size:15px}
  .reset{border:1px solid var(--line); background:#fff; color:var(--sub); font-size:11.5px; font-weight:800;
         padding:6px 11px; border-radius:999px; cursor:pointer; font-family:inherit}

  /* ── 카테고리 ── */
  .cat{margin:0 0 10px}
  .cat h2{display:flex; align-items:center; gap:8px; margin:20px 0 10px; font-size:15px; font-weight:900; letter-spacing:-.02em}
  .cat h2 .dot{width:9px; height:9px; border-radius:3px; background:var(--blue)}
  .cat h2 .n{font-size:11px; font-weight:800; color:var(--mute); background:#EDF1F7; padding:2px 8px; border-radius:999px}

  /* ── 상품 카드 ── */
  .p{background:var(--card); border:1px solid var(--line); border-radius:15px; margin-bottom:9px;
     overflow:hidden; transition:box-shadow .18s, border-color .18s}
  .p.open{border-color:var(--blueLine); box-shadow:0 8px 26px rgba(217,119,6,.10)}
  .ph{display:flex; align-items:flex-start; gap:10px; padding:14px 14px; cursor:pointer; position:relative}
  .ph:hover{background:#FAFCFF}
  .pn{flex:1; min-width:0}
  .pn h3{margin:0 0 6px; font-size:15px; font-weight:800; letter-spacing:-.02em; line-height:1.4}
  .pmeta{display:flex; flex-wrap:wrap; gap:5px}
  .b{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:6px; background:#F1F4F9; color:#4A5568; white-space:nowrap}
  .b.age{background:#FFFBEB; color:var(--blue)}
  .b.gp{background:#E7F6F8; color:#0E7490}
  .b.std{background:#ECFDF5; color:#047857}
  .b.easy{background:#FEF3C7; color:#92400E}
  .b.hot{background:#FDECEE; color:var(--meritz)}
  .arw{flex:none; width:24px; height:24px; border-radius:50%; background:#F1F4F9; color:var(--sub);
       display:flex; align-items:center; justify-content:center; font-size:11px; transition:.22s; margin-top:2px}
  .p.open .arw{transform:rotate(180deg); background:var(--blue); color:#fff}

  .pb{display:none; padding:0 14px 16px; border-top:1px dashed var(--line); margin-top:-1px}
  .p.open .pb{display:block; animation:fade .22s ease}
  @keyframes fade{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}

  .sec{margin-top:14px}
  .sec > .t{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:900; color:var(--mute);
       letter-spacing:.02em; margin-bottom:7px}

  .kv{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  @media(max-width:520px){ .kv{grid-template-columns:1fr} }
  .kv div{background:#F8FAFD; border:1px solid var(--line); border-radius:10px; padding:9px 11px}
  .kv .k{font-size:10.5px; font-weight:800; color:var(--mute); margin-bottom:2px}
  .kv .v{font-size:13px; font-weight:700; line-height:1.55}

  /* 알릴의무 강조 */
  .duty{border:1.5px solid var(--blueLine); background:linear-gradient(180deg,#F7FAFF,#fff);
        border-radius:13px; padding:12px 12px 10px}
  .duty .dt{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:900; color:var(--blue); margin-bottom:9px}
  .dtag{display:inline-block; font-size:11px; font-weight:800; background:var(--blue); color:#fff;
        padding:4px 10px; border-radius:999px; margin:0 4px 6px 0}
  table.dt2{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; background:#fff;
        border:1px solid var(--blueLine); border-radius:10px; overflow:hidden}
  table.dt2 th{background:#E8F0FE; color:var(--blueDeep); font-weight:900; font-size:11px; padding:8px 10px; text-align:left; white-space:nowrap}
  table.dt2 td{padding:9px 10px; border-top:1px solid #EAF0FA; vertical-align:top; line-height:1.5}
  table.dt2 td.pd{font-weight:900; color:var(--blue); white-space:nowrap; background:#FBFDFF; width:1%}
  .note{margin-top:8px; font-size:11.5px; color:var(--warn); background:var(--warnBg); border:1px solid #FBE2B5;
        border-radius:9px; padding:8px 10px; line-height:1.6}
  .note div + div{margin-top:4px}
  .stdlink{margin-top:8px; font-size:11.5px; color:var(--sub)}

  ul.li{margin:0; padding:0; list-style:none}
  ul.li li{position:relative; padding:6px 0 6px 15px; font-size:13px; line-height:1.6; border-top:1px solid #F2F4F8}
  ul.li li:first-child{border-top:0}
  ul.li li::before{content:""; position:absolute; left:2px; top:14px; width:5px; height:5px; border-radius:50%; background:var(--blue3)}
  ul.li li.hl{color:var(--meritz); font-weight:700}

  var P = D.products, DT = D.dtypes, STD = D.std;

  // ── 사용 로그 (Supabase) : 검색기·시뮬레이터와 동일한 usage_logs 테이블에 기록 ──
  var LOG = {
    url:'https://iqmlianuyoaypidmfamq.supabase.co',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWxpYW51eW9heXBpZG1mYW1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzIzMzMsImV4cCI6MjA5NzY0ODMzM30.e7za_xbYV32yFHEC2gleku7Xl-S3GU0CNBHb-csWhXE',
    tool:'products'
  };
  function logEvent(event, fields){
    try{
      var body = { tool:LOG.tool, event:event };
      if(fields){ for(var k in fields){ if(fields[k]) body[k]=fields[k]; } }
      fetch(LOG.url+'/rest/v1/usage_logs', {
        method:'POST',
        headers:{ apikey:LOG.key, Authorization:'Bearer '+LOG.key, 'Content-Type':'application/json', Prefer:'return=minimal' },
        body: JSON.stringify(body), keepalive:true
      }).catch(function(){});
    }catch(e){}
  }
  var _searchTimer;
  function logSearchDebounced(term){          // 타이핑 중 매 글자 기록 방지 (0.8초 멈추면 1회)
    clearTimeout(_searchTimer);
    if(!term || term.length<2) return;
    _searchTimer = setTimeout(function(){ logEvent('search', {term:term}); }, 800);
  }

  var CATS = ['통합상품','간편상품','전용상품','단품상품','펫보험','재물보험','실손의료비'];
  var F2   = ['일반심사','간편심사','건강고지','태아','단체','화재','반려동물'];
  var F3   = ['성인','태아·어린이','단기납 고환급','순수신인','무해지/미지급형','세만기','연만기'];
  var F4   = ['암','치아','치매·간병','근골격계','상해','운전자·상해·화재','사망','단체·기업','실손','화재·재물','반려동물','유병자 간편심사'];

  var sel = {1:[],2:[],3:[],4:[]}, q='';

  // 검색 인덱스
  P.forEach(function(p){
    p._s = [p.n, p.cat, p.grp, p.age, p.term, p.tags.join(' '), p.dt.join(' '),
            p.type.join(' '), p.waiver.join(' '), p.plan.join(' '), p.feat.join(' '),
            p.duty.types.join(' '), p.duty.rows.map(function(r){return r.join(' ')}).join(' '),
            p.duty.notes.join(' ')].join(' ').toLowerCase();
    p._facet = [p.cat, p.grp].concat(p.tags).concat(p.dt);
  });

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }

  // 칩 렌더
  function chips(id, arr, g){
    document.getElementById(id).innerHTML = arr.map(function(v){
      return '<button class="chip'+(g>1?' g'+g:'')+'" data-g="'+g+'" data-v="'+esc(v)+'">'+esc(v)+'</button>';
    }).join('');
  }
  chips('f1', CATS, 1); chips('f2', F2, 2); chips('f3', F3, 3); chips('f4', F4, 4);

  document.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){
      var g = +c.dataset.g, v = c.dataset.v, i = sel[g].indexOf(v);
      if(i<0){ sel[g].push(v); c.classList.add('on'); logEvent('filter',{term:v}); } else { sel[g].splice(i,1); c.classList.remove('on'); }
      render();
    };
  });

  function match(p){
    if(q && p._s.indexOf(q)<0) return false;
    for(var g=1; g<=4; g++){
      if(!sel[g].length) continue;
      var ok = sel[g].some(function(v){ return p._facet.indexOf(v)>=0; });
      if(!ok) return false;
    }
    return true;
  }

  function dutyHTML(p){
    var h = '<div class="duty"><div class="dt">⚠️ 피보험자 병력관련 알릴의무</div>';
    if(p.duty.types.length) h += p.duty.types.map(function(t){return '<span class="dtag">'+esc(t)+'</span>'}).join('');
    else if(p.dt.length) h += p.dt.map(function(t){return '<span class="dtag">'+esc(t)+'</span>'}).join('');
    var rows = p.duty.rows.length ? p.duty.rows : (p.useStd ? STD : []);
    if(rows.length){
      h += '<table class="dt2"><tr><th>기간</th><th>고지 대상</th></tr>' +
        rows.map(function(r){ return '<tr><td class="pd">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>' }).join('') +
        '</table>';
      if(!p.duty.rows.length && p.useStd)
        h += '<div class="stdlink">※ 위 표는 <b>표준 알릴의무</b> 공통 내용입니다.</div>';
    } else if(!p.duty.notes.length){
      h += '<div class="none">원본 자료에 별도 표기 없음</div>';
    }
    if(p.duty.notes.length)
      h += '<div class="note">'+p.duty.notes.map(function(n){return '<div>'+esc(n)+'</div>'}).join('')+'</div>';
    h += '</div>';
    return h;
  }

  function card(p){
    var badges = '<span class="b age">👤 '+esc(p.age)+'</span>' +
      (p.term ? '<span class="b">'+esc(p.term)+'</span>' : '') +
      p.dt.map(function(t){
        var c = t.indexOf('간편')===0 ? 'easy' : (t.indexOf('표준')===0 ? 'std' : 'gp');
        return '<span class="b '+c+'">'+esc(t)+'</span>';
      }).join('') +
      (p.tags.indexOf('단기납 고환급')>=0 ? '<span class="b hot">단기납 고환급</span>' : '') +
      (p.tags.indexOf('순수신인')>=0 ? '<span class="b hot">순수신인</span>' : '');

    var h = '<div class="p" data-n="'+esc(p.n)+'"><div class="ph"><div class="pn"><h3>'+esc(p.n)+'</h3>' +
      '<div class="pmeta">'+badges+'</div></div><div class="arw">▼</div></div><div class="pb">';

    h += '<div class="sec"><div class="t">📌 기본 정보</div><div class="kv">' +
      '<div><div class="k">가입 연령</div><div class="v">'+esc(p.age||'-')+'</div></div>' +
      '<div><div class="k">갱신 / 만기</div><div class="v">'+esc(p.term||'-')+'</div></div>' +
      '<div style="grid-column:1/-1"><div class="k">종구분 (선택유형)</div><div class="v">' +
        (p.type.length ? p.type.map(esc).join('<br>') : '-') + '</div></div>' +
      '</div></div>';

    h += '<div class="sec"><div class="t">⚠️ 알릴의무 (고지의무)</div>'+dutyHTML(p)+'</div>';

    h += '<div class="sec"><div class="t">💊 납입면제 사유</div>';
    if(p.waiver.length && p.waiver[0]!=='없음'){
      h += '<div class="wv">'+p.waiver.map(function(w){
        return /^[0-9]+대|납입면제 [12]형/.test(w) ? '<div class="h">'+esc(w)+'</div>' : '<div>'+esc(w)+'</div>';
      }).join('')+'</div>';
    } else h += '<div class="none">없음</div>';
    h += '<div class="stdlink">※ 전상품 납면제외 : 간병인지원일당, 가족일상생활배상책임, 가전제품고장수리, 산정특례, 암치료비(표적·면역·다빈치)</div></div>';

    h += '<div class="sec"><div class="t">🧩 인수플랜</div>';
    if(p.plan.length && p.plan[0]!=='없음'){
      h += '<div class="pl">'+p.plan.map(function(x){
        return /개\s*$/.test(x) ? '<span class="hd2">'+esc(x)+'</span>' : '<span>'+esc(x)+'</span>';
      }).join('')+'</div>';
    } else h += '<div class="none">없음</div>';
    h += '</div>';

    h += '<div class="sec"><div class="t">✨ 상품특징</div>';
    if(p.feat.length){
      h += '<ul class="li">'+p.feat.map(function(f){
        return '<li class="'+(f.charAt(0)==='★'?'hl':'')+'">'+esc(f)+'</li>';
      }).join('')+'</ul>';
    } else h += '<div class="none">-</div>';
    h += '</div></div></div>';
    return h;
  }

  function render(){
    var hit = P.filter(match);
    document.getElementById('cnt').textContent = hit.length;
    var box = document.getElementById('list');
    if(!hit.length){
      box.innerHTML = '<div class="empty"><div class="e">🔎</div><b>조건에 맞는 상품이 없습니다</b><br><span style="font-size:12.5px">검색어나 필터를 줄여보세요</span></div>';
      return;
    }
    var h = '';
    CATS.forEach(function(c){
      var g = hit.filter(function(p){ return p.cat===c; });
      if(!g.length) return;
      h += '<div class="cat"><h2><span class="dot"></span>'+esc(c)+'<span class="n">'+g.length+'</span></h2>' +
           g.map(card).join('') + '</div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('.ph').forEach(function(ph){
      ph.onclick = function(){
        var p = ph.parentNode, was = p.classList.contains('open');
        p.classList.toggle('open');
        if(!was){
          logEvent('view', {term: p.getAttribute('data-n')});
          setTimeout(function(){
            var r = p.getBoundingClientRect();
            if(r.top < 60) window.scrollBy({top:r.top-70, behavior:'smooth'});
          },230);
        }
      };
    });
  }

  // 알릴의무 유형별 보기
  function renderDuty(){
    var h = '<p style="font-size:12.5px;color:var(--sub);margin:2px 2px 14px;font-weight:600">고지 유형별로 묶어봤습니다. 상품명을 누르면 해당 상품으로 이동합니다.</p>';
    DT.forEach(function(d){
      h += '<div class="dcard"><h3>'+esc(d.k)+' <span style="font-size:11.5px;color:var(--mute)">· '+d.items.length+'개 상품</span></h3>';
      h += '<div class="src">기준 : '+esc(d.from)+'</div>';
      if(d.rows.length){
        h += '<table class="dt2"><tr><th>기간</th><th>고지 대상</th></tr>' +
          d.rows.map(function(r){ return '<tr><td class="pd">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>' }).join('') + '</table>';
      }
      if(d.notes.length)
        h += '<div class="note">'+d.notes.map(function(n){return '<div>'+esc(n)+'</div>'}).join('')+'</div>';
      h += '<div class="plist"><b>해당 상품</b>'+d.items.map(function(n){return '<span data-go="'+esc(n)+'">'+esc(n)+'</span>'}).join('')+'</div></div>';
    });
    var v = document.getElementById('viewDuty');
    v.innerHTML = h;
    v.querySelectorAll('[data-go]').forEach(function(s){
      s.onclick = function(){
        tab('prod');
        sel={1:[],2:[],3:[],4:[]}; document.querySelectorAll('.chip.on').forEach(function(c){c.classList.remove('on')});
        var i=document.getElementById('q'); i.value=s.dataset.go; q=s.dataset.go.toLowerCase();
        document.getElementById('clr').classList.add('on');
        render();
        setTimeout(function(){
          var t = document.querySelector('.p[data-n="'+s.dataset.go.replace(/"/g,'&quot;')+'"]');
          if(t){ t.classList.add('open'); t.scrollIntoView({behavior:'smooth', block:'center'}); }
        },60);
      };
    });
  }

  function tab(n){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab===n) });
    document.getElementById('viewProd').style.display = n==='prod' ? '' : 'none';
    document.getElementById('viewDuty').style.display = n==='duty' ? '' : 'none';
    window.scrollTo({top:0});
  }
  document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){ tab(t.dataset.tab) } });

  var qi = document.getElementById('q'), clr = document.getElementById('clr');
  qi.oninput = function(){ q = qi.value.trim().toLowerCase(); clr.classList.toggle('on', !!q); render(); logSearchDebounced(q); };
  clr.onclick = function(){ qi.value=''; q=''; clr.classList.remove('on'); render(); qi.focus(); };
  document.getElementById('reset').onclick = function(){
    sel={1:[],2:[],3:[],4:[]}; q=''; qi.value=''; clr.classList.remove('on');
    document.querySelectorAll('.chip.on').forEach(function(c){c.classList.remove('on')});
    render();
  };
  document.getElementById('moreBtn').onclick = function(){
    var a = document.getElementById('adv'); a.classList.toggle('on');
    this.textContent = a.classList.contains('on') ? '－ 상세필터 접기' : '＋ 상세필터 (대상 · 특성 · 담보군)';
  };
  var tp = document.getElementById('top');
  tp.onclick = function(){ window.scrollTo({top:0, behavior:'smooth'}) };
  window.onscroll = function(){ tp.classList.toggle('on', window.scrollY > 500) };

  renderDuty();
  render();
})();
</script>
</body>
</html>
